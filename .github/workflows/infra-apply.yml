name: Infrastructure · Apply

# ─────────────────────────────────────────────────────────────────────────────
# Infra apply, gated the same way as the app deploys (backend-deploy.yml):
#   push to main       → apply _shared + develop  (auto)
#   push a v*.*.* tag  → apply _shared + prod      (prod also gated by the
#                        "production" GitHub Environment's required reviewer)
#
# Prod infra can NOT be applied by a normal merge to main — it only happens on
# a deliberate semver tag, so an accidental push can never touch production.
#
# PREREQUISITE (Option A shared runtime): the platform shared-runtime stacks in
# qnsc-infra — runtime-dev (for develop) and runtime-prod (for prod) — own the
# shared VPC/NAT/ALB (+ prod cache/WAF) and MUST be applied before this product
# stack. develop/prod consume them via terraform_remote_state, so a product
# apply fails if the runtime state doesn't exist yet. The platform pipeline
# applies runtime first.
#
# Structure is intentionally identical to rally/.github/workflows/infra-apply.yml
# (shared composite actions + the same staged/gated jobs); only the values differ
# (role prefix, TF_VARs). Keep the two products in lock-step.
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main]
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
    paths:
      - "infra/live/**"
      # modules/** matters too: `module "stack"` is a LOCAL path module
      # (source = "../../modules/stack"), so editing it changes the plan for both
      # environments while touching nothing under live/. Without this a module-only
      # commit would merge to main and never be applied — the plan diverging from
      # reality until some unrelated live/** edit picked it up and applied both at once.
      - "infra/modules/**"
      - ".github/workflows/infra-apply.yml"
  workflow_dispatch:

# Serialize by ENVIRONMENT, matching backend-deploy.yml and web-deploy.yml: all
# prod (tag) applies share one group, all develop (branch) applies share another,
# and the two run in PARALLEL.
#
# This was briefly one constant group for the whole repo, to stop a release's
# near-simultaneous main push and vX.Y.Z tag running apply-shared against the same
# infra/live/_shared state concurrently — a real bug, state-lock failure on every
# release. But a repo-wide group also makes DEVELOP queue behind PROD, and prod is
# gated on a required reviewer, so an unapproved production apply freezes every
# develop apply until a human notices. rally shipped that variant, found it
# silently swallowed two develop applies, and moved the lock to where the
# collision actually lives.
#
# The shared-state collision is a property of ONE JOB, so it is fixed at that job
# (see apply-shared's own `concurrency` below) rather than by serialising the whole
# workflow. Develop and prod touch different state files and different
# environments; nothing else about them needs to be mutually exclusive.
#
# Never cancel a running apply.
concurrency:
  group: infra-apply-${{ github.repository }}-${{ github.ref_type == 'tag' && 'prod' || 'develop' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  TOFU_VERSION: "1.9.1"
  AWS_REGION: ap-southeast-1

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Shared (ECR + OIDC roles) — always applies first (both branch and tag runs).
  # ───────────────────────────────────────────────────────────────────────────
  apply-shared:
    runs-on: ubuntu-latest
    environment: shared
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 60

    # The one thing that genuinely must not run twice at once, and the reason the
    # whole workflow briefly shared a group: a release pushes main and the vX.Y.Z
    # tag near-simultaneously, so both runs reach this job and would apply the same
    # infra/live/_shared state concurrently — state-lock failure on every release.
    #
    # A CONSTANT group here (not keyed on ref) keeps that serialised while leaving
    # the per-environment applies free to run in parallel. This job holds the lock
    # only while it is actually applying: the production approval gate is on
    # apply-prod, a separate job, so a release waiting for a reviewer no longer
    # blocks develop.
    concurrency:
      group: infra-apply-shared-${{ github.repository }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false

      - uses: QNSC-VN/qnsc-ci/actions/setup-tofu-aws@v1.10.0
        with:
          role-arn: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/opshub-github-infra-apply
          aws-region: ${{ env.AWS_REGION }}
          tofu-version: ${{ env.TOFU_VERSION }}

      - name: tofu init
        working-directory: infra/live/_shared
        run: tofu init -input=false

      - name: tofu validate
        working-directory: infra/live/_shared
        run: tofu validate

      - name: tofu apply
        working-directory: infra/live/_shared
        run: tofu apply -input=false -auto-approve

  # ───────────────────────────────────────────────────────────────────────────
  # Develop — only on a branch push to main (NOT on tag pushes).
  # ───────────────────────────────────────────────────────────────────────────
  apply-develop:
    needs: apply-shared
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    environment: develop   # no approval gate
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false

      - uses: QNSC-VN/qnsc-ci/actions/setup-tofu-aws@v1.10.0
        with:
          role-arn: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/opshub-github-infra-apply
          aws-region: ${{ env.AWS_REGION }}
          tofu-version: ${{ env.TOFU_VERSION }}

      - name: tofu init
        working-directory: infra/live/develop
        run: tofu init -input=false

      - name: tofu validate
        working-directory: infra/live/develop
        run: tofu validate

      - name: tofu apply
        working-directory: infra/live/develop
        run: tofu apply -input=false -auto-approve
        env:
          # The Entra ids and the Cloudflare account id are public identifiers held in
          # infra/live/develop/variables.tf, so plan and apply now read the same values
          # (see infra-plan.yml); develop's image_tag is `latest` in the caller; and
          # acm_cert_arn was a required variable no resource read.
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Org-level secret, same one rally already maps. Without this,
          # grafana_alerting_auth stays empty and module.alerts/grafana_slo/
          # grafana_dashboard all count-gate to zero — apply "succeeds" but creates
          # no Grafana resources at all, silently.
          TF_VAR_grafana_alerting_auth: ${{ secrets.GRAFANA_ALERTS_TOKEN }}

      # Mint a short-lived installation token from the RELEASE_BOT GitHub App
      # (same app release.yml uses) so we never need a long-lived user PAT.
      # Requires the app to have "Variables: read and write" on this repo.
      # Falls back to no token (publish step skipped) when the app isn't set.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        id: app-token
        if: ${{ vars.RELEASE_BOT_APP_ID != '' }}
        continue-on-error: true
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      # Sync the infra IDs the deploy workflows read (backend-deploy.yml,
      # web-deploy.yml) straight from Terraform outputs, so a rebuild that changes
      # subnet/SG/Pages IDs can never leave the vars stale. Skipped automatically when
      # no app token could be minted.
      #
      # A write can still be rejected — an App installation token needs the
      # "Variables: read and write" grant, and cannot write to a protected environment
      # at all. That is surfaced as a visible ::warning:: naming each variable to
      # reconcile, never a silent green, but it never blocks the apply. This step used
      # `continue-on-error`, which turned exactly that case into a green run with stale
      # variables the deploy would then read.
      - name: Publish infra IDs to develop environment variables
        if: ${{ steps.app-token.outputs.token != '' }}
        working-directory: infra/live/develop
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          missed=0
          set_var() {
            if gh variable set "$1" --env develop --repo "$REPO" --body "$2"; then
              echo "  set $1"
            else
              echo "::warning title=infra-id publish::could not set '$1' on the develop environment — reconcile manually: gh variable set $1 --env develop --repo $REPO --body '$2'"
              missed=1
            fi
          }
          set_var ECS_CLUSTER           "$(tofu output -raw ecs_cluster_name)"
          set_var ECS_API_SERVICE       "$(tofu output -raw ecs_api_service)"
          set_var ECS_WORKER_SERVICE    "$(tofu output -raw ecs_worker_service)"
          set_var ECS_MIGRATOR_TASK_DEF "$(tofu output -raw ecs_migrator_task_def)"
          set_var ECS_MIGRATOR_SUBNET   "$(tofu output -json private_subnet_ids | jq -r 'join(",")')"
          set_var ECS_MIGRATOR_SG       "$(tofu output -raw sg_app_id)"
          set_var PAGES_PROJECT         "$(tofu output -raw web_pages_project)"
          if [[ $missed -ne 0 ]]; then
            echo "::warning title=infra-id publish::One or more develop infra-ID vars were not auto-published — the deploy reads these, so verify they match Terraform outputs to avoid drift."
          fi

  # ───────────────────────────────────────────────────────────────────────────
  # Production — only on a v*.*.* tag push, AND requires manual approval via the
  # "production" GitHub Environment (configure a required reviewer there).
  # ───────────────────────────────────────────────────────────────────────────
  apply-prod:
    needs: apply-shared
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false

      - uses: QNSC-VN/qnsc-ci/actions/setup-tofu-aws@v1.10.0
        with:
          role-arn: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/opshub-github-infra-apply
          aws-region: ${{ env.AWS_REGION }}
          tofu-version: ${{ env.TOFU_VERSION }}

      - name: tofu init
        working-directory: infra/live/prod
        run: tofu init -input=false

      - name: tofu validate
        working-directory: infra/live/prod
        run: tofu validate

      - name: tofu apply
        working-directory: infra/live/prod
        run: tofu apply -input=false -auto-approve
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Org-level secret, same one rally already maps. Without this,
          # grafana_alerting_auth stays empty and module.alerts/grafana_slo/
          # grafana_dashboard all count-gate to zero — apply "succeeds" but creates
          # no Grafana resources at all, silently.
          TF_VAR_grafana_alerting_auth: ${{ secrets.GRAFANA_ALERTS_TOKEN }}
          # Pin production to the exact release tag that triggered this apply (e.g.
          # v1.4.2), so an infra apply can never move production onto a different image
          # than the release it belongs to.
          #
          # This read `vars.PINNED_IMAGE_TAG`, a variable a human had to remember to
          # update — and which does not exist on this repo, so the apply would have
          # failed on a missing required variable. github.ref_name is the tag itself and
          # cannot go stale.
          TF_VAR_image_tag:            ${{ github.ref_name }}

      # Mint a short-lived installation token from the RELEASE_BOT GitHub App so we
      # never need a long-lived user PAT. Requires the app to have
      # "Variables: read and write" on this repo. Falls back to no token (publish step
      # skipped) when the app isn't configured.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        id: app-token
        if: ${{ vars.RELEASE_BOT_APP_ID != '' }}
        continue-on-error: true
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      # The production half of the output sync, which this workflow simply did not have:
      # develop published its infra IDs and production never did, so backend-deploy.yml
      # would read whatever a human had typed into the production environment — and
      # today that environment holds no variables at all.
      #
      # NOTE: `production` is a PROTECTED environment (required reviewers), and a GitHub
      # App installation token cannot write variables to a protected environment (403
      # "Resource not accessible by integration"). When that happens each variable is
      # named in a ::warning:: to reconcile by hand — never a silent green — but the
      # apply is not blocked. The prod infra IDs are deterministic and stable, so they
      # persist between applies; a human reconciles them on the rare rebuild that
      # changes one.
      - name: Publish infra IDs to production environment variables
        if: ${{ steps.app-token.outputs.token != '' }}
        working-directory: infra/live/prod
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          missed=0
          set_var() {
            if gh variable set "$1" --env production --repo "$REPO" --body "$2"; then
              echo "  set $1"
            else
              echo "::warning title=infra-id publish::could not set '$1' on the production environment (a protected env rejects App-token writes) — reconcile manually: gh variable set $1 --env production --repo $REPO --body '$2'"
              missed=1
            fi
          }
          set_var ECS_CLUSTER           "$(tofu output -raw ecs_cluster_name)"
          set_var ECS_API_SERVICE       "$(tofu output -raw ecs_api_service)"
          set_var ECS_WORKER_SERVICE    "$(tofu output -raw ecs_worker_service)"
          set_var ECS_MIGRATOR_TASK_DEF "$(tofu output -raw ecs_migrator_task_def)"
          set_var ECS_MIGRATOR_SUBNET   "$(tofu output -json private_subnet_ids | jq -r 'join(",")')"
          set_var ECS_MIGRATOR_SG       "$(tofu output -raw sg_app_id)"
          set_var PAGES_PROJECT         "$(tofu output -raw web_pages_project)"
          if [[ $missed -ne 0 ]]; then
            echo "::warning title=infra-id publish::One or more production infra-ID vars were not auto-published — the deploy reads these, so verify they match Terraform outputs to avoid drift."
          fi
