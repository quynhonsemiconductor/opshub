name: Infrastructure · Apply
# What the run list shows. Without this a dispatch with `allow_destructive` on is indistinguishable, in the
# list, from one with it off, and it is the one that may delete DNS records. A push or tag shows its ref.
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Infrastructure · Apply · dispatch{0}', inputs.allow_destructive && ' · ALLOW DESTRUCTIVE' || '') || format('Infrastructure · Apply · {0}', github.ref_name) }}

# ─────────────────────────────────────────────────────────────────────────────
# Infra apply, gated the same way as the app deploys (backend-deploy.yml):
#   push to main       → apply _shared + develop  (auto)
#   (prod is GONE: the AWS opshub production stack was destroyed 2026-10-21 —
#    owner decision; opshub has no prod in the on-prem plan. The apply-prod job
#    and the v*.*.* tag trigger were removed with it, so nothing can recreate
#    the stack from this repo. Final state: opshub/prod/terraform.tfstate empty,
#    snapshot opshub-prod-db-final-2026-10-21 retained.)
#
# Prod infra can NOT be applied by a normal merge to main — it only happens on
# a deliberate semver tag, so an accidental push can never touch production.
#
# PREREQUISITE (Option A shared runtime): the platform shared-runtime stacks in
# qnsc-infra — runtime-dev (for develop) and runtime-prod (for prod) — own the
# shared VPC/NAT/ALB (+ prod cache/WAF) and MUST be applied before this product
# stack. develop/prod consume them via terraform_remote_state, so a product
# apply fails if the runtime state doesn't exist yet. The platform pipeline
# applies runtime first.
#
# Structure is intentionally identical to rova/.github/workflows/infra-apply.yml
# (shared composite actions + the same staged/gated jobs); only the values differ
# (role prefix, TF_VARs). Keep the two products in lock-step.
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main]
    paths:
      - "infra/live/**"
      # modules/** matters too: `module "stack"` is a LOCAL path module
      # (source = "../../modules/stack"), so editing it changes the plan for both
      # environments while touching nothing under live/. Without this a module-only
      # commit would merge to main and never be applied — the plan diverging from
      # reality until some unrelated live/** edit picked it up and applied both at once.
      - "infra/modules/**"
      - ".github/workflows/infra-apply.yml"
  workflow_dispatch:
    inputs:
      allow_destructive:
        description: "Let this run delete or replace DNS / identity resources (destructive-guard). Off by default; on a push the label `allow-dns-destroy` on the merged PR does the same."
        type: boolean
        default: false
      destroy_prod:
        description: "TEMPORARY (until the teardown lands): run destroy-prod — plan the prune of opshub/prod and apply it. Requires the production Environment reviewer. Read infra/live/prod/main.tf FIRST: the owner runbook (snapshot, deletion protection, bucket check) must be done by hand before this."
        type: boolean
        default: false

# Serialize by ENVIRONMENT, matching backend-deploy.yml and web-deploy.yml:
# develop (branch) applies share one group.
#
# This was briefly one constant group for the whole repo, to stop a release's
# near-simultaneous main push and vX.Y.Z tag running apply-shared against the same
# infra/live/_shared state concurrently — a real bug, state-lock failure on every
# release. But a repo-wide group also makes DEVELOP queue behind PROD, and prod is
# gated on a required reviewer, so an unapproved production apply freezes every
# develop apply until a human notices. rova shipped that variant, found it
# silently swallowed two develop applies, and moved the lock to where the
# collision actually lives.
#
# The shared-state collision is a property of ONE JOB, so it is fixed at that job
# (see apply-shared's own `concurrency` below) rather than by serialising the whole
# workflow. Develop and prod touch different state files and different
# environments; nothing else about them needs to be mutually exclusive.
#
# Never cancel a running apply.
concurrency:
  group: infra-apply-${{ github.repository }}-develop
  cancel-in-progress: false

permissions:
  contents: read

env:
  TOFU_VERSION: "1.9.1"
  AWS_REGION: ap-southeast-1

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Shared (ECR + OIDC roles) — always applies first (both branch and tag runs).
  # ───────────────────────────────────────────────────────────────────────────
  apply-shared:
    runs-on: ubuntu-latest
    environment: shared
    permissions:
      contents: read
      id-token: write
      pull-requests: read # destructive-guard reads the labels of the PR being merged
    timeout-minutes: 60

    # The one thing that genuinely must not run twice at once, and the reason the
    # whole workflow briefly shared a group: a release pushes main and the vX.Y.Z
    # tag near-simultaneously, so both runs reach this job and would apply the same
    # infra/live/_shared state concurrently — state-lock failure on every release.
    #
    # A CONSTANT group here (not keyed on ref) keeps that serialised while leaving
    # the per-environment applies free to run in parallel. This job holds the lock
    # only while it is actually applying: the production approval gate is on
    # a separate job, so a release waiting for a reviewer no longer
    # blocks develop.
    concurrency:
      group: infra-apply-shared-${{ github.repository }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false

      - uses: quynhonsemiconductor/ci/actions/setup-tofu-aws@691668f7a1bd4f4a3416f9224ae7ff7ebe831a3a # v1.23.0
        with:
          role-arn: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/opshub-github-infra-apply
          aws-region: ${{ env.AWS_REGION }}
          tofu-version: ${{ env.TOFU_VERSION }}

      - name: tofu init
        working-directory: infra/live/_shared
        run: tofu init -input=false

      - name: tofu validate
        working-directory: infra/live/_shared
        run: tofu validate

      # Plan, then apply THAT PLAN. A bare `tofu apply -auto-approve` plans again and applies the result without any
      # check reading it: on 2026-10-09 a provider lock bump turned nine DNS/edge resources into "replace"
      # (zone_id -> null) and that is what was applied. Here the plan is printed by this step and saved to `tfplan`,
      # and the next step applies that file, so what the log shows is what runs, and a guard can read the same file.
      #
      # Variables are given HERE only. A saved plan carries its own variable values: OpenTofu 1.9 (this workflow's
      # version) ignores a TF_VAR_* in the environment at apply time, and later versions refuse a different one
      # ("Mismatch between input and plan variable value"). Either way the apply step below deliberately has no
      # `env`. `tfplan` holds those values (sensitive ones included): it stays on this runner, never uploaded.
      - name: tofu plan (saved as tfplan)
        working-directory: infra/live/_shared
        run: tofu plan -input=false -out=tfplan
        env:
          # REQUIRED by infra/live/_shared (validated, no default). An organisation variable.
          TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}

      # Refuse a saved plan that DELETES or REPLACES a DNS, edge, mail-identity, certificate or key resource (the
      # 2026-10-09 outage) unless this run is allowed to: the PR being merged carries the label `allow-dns-destroy`
      # (ON TAG RUNS THE LOOKUP RESOLVES TO THE RELEASE PR, so a destructive prod change needs the label on the
      # release PR), or a manual dispatch passed `allow_destructive`. It judges `tfplan` through `tofu show -json`
      # (piped, never written out): byte for byte the plan the next step applies. See
      # docs/runbooks/infra-destructive-guard.md.
      - name: destructive-guard (tfplan)
        uses: quynhonsemiconductor/ci/actions/destructive-guard@691668f7a1bd4f4a3416f9224ae7ff7ebe831a3a # v1.23.0
        with:
          working-directory: infra/live/_shared
          plan-file: tfplan
          dispatch-allow: ${{ inputs.allow_destructive }}

      - name: tofu apply (the saved plan)
        working-directory: infra/live/_shared
        run: tofu apply -input=false tfplan

  # ───────────────────────────────────────────────────────────────────────────
  # Develop — only on a branch push to main (NOT on tag pushes).
  # ───────────────────────────────────────────────────────────────────────────
  apply-develop:
    # A dispatch that asks for the prod destroy runs ONLY that.
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.destroy_prod) }}
    needs: apply-shared
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    environment: develop   # no approval gate
    permissions:
      contents: read
      id-token: write
      pull-requests: read # destructive-guard reads the labels of the PR being merged
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false

      - uses: quynhonsemiconductor/ci/actions/setup-tofu-aws@691668f7a1bd4f4a3416f9224ae7ff7ebe831a3a # v1.23.0
        with:
          role-arn: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/opshub-github-infra-apply
          aws-region: ${{ env.AWS_REGION }}
          tofu-version: ${{ env.TOFU_VERSION }}

      - name: tofu init
        working-directory: infra/live/develop
        run: tofu init -input=false

      - name: tofu validate
        working-directory: infra/live/develop
        run: tofu validate

      # Plan, then apply THAT PLAN. A bare `tofu apply -auto-approve` plans again and applies the result without any
      # check reading it: on 2026-10-09 a provider lock bump turned nine DNS/edge resources into "replace"
      # (zone_id -> null) and that is what was applied. Here the plan is printed by this step and saved to `tfplan`,
      # and the next step applies that file, so what the log shows is what runs, and a guard can read the same file.
      #
      # Variables are given HERE only. A saved plan carries its own variable values: OpenTofu 1.9 (this workflow's
      # version) ignores a TF_VAR_* in the environment at apply time, and later versions refuse a different one
      # ("Mismatch between input and plan variable value"). Either way the apply step below deliberately has no
      # `env`. `tfplan` holds those values (sensitive ones included): it stays on this runner, never uploaded.
      - name: tofu plan (saved as tfplan)
        working-directory: infra/live/develop
        run: tofu plan -input=false -out=tfplan
        env:
          # The Entra ids and the Cloudflare account id are public identifiers held in
          # infra/live/develop/variables.tf, so plan and apply now read the same values
          # (see infra-plan.yml); develop's image_tag is `latest` in the caller; and
          # acm_cert_arn was a required variable no resource read.
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Org-level secret, same one rova already maps. Without this,
          # grafana_alerting_auth stays empty and module.alerts/grafana_slo/
          # grafana_dashboard all count-gate to zero — apply "succeeds" but creates
          # no Grafana resources at all, silently.
          TF_VAR_grafana_alerting_auth: ${{ secrets.GRAFANA_ALERTS_TOKEN }}

      # Refuse a saved plan that DELETES or REPLACES a DNS, edge, mail-identity, certificate or key resource (the
      # 2026-10-09 outage) unless this run is allowed to: the PR being merged carries the label `allow-dns-destroy`
      # (ON TAG RUNS THE LOOKUP RESOLVES TO THE RELEASE PR, so a destructive prod change needs the label on the
      # release PR), or a manual dispatch passed `allow_destructive`. It judges `tfplan` through `tofu show -json`
      # (piped, never written out): byte for byte the plan the next step applies. See
      # docs/runbooks/infra-destructive-guard.md.
      - name: destructive-guard (tfplan)
        uses: quynhonsemiconductor/ci/actions/destructive-guard@691668f7a1bd4f4a3416f9224ae7ff7ebe831a3a # v1.23.0
        with:
          working-directory: infra/live/develop
          plan-file: tfplan
          dispatch-allow: ${{ inputs.allow_destructive }}

      - name: tofu apply (the saved plan)
        working-directory: infra/live/develop
        run: tofu apply -input=false tfplan

      # Mint a short-lived installation token from the qnsc-automation GitHub App
      # (same app release.yml uses) so we never need a long-lived user PAT.
      # Requires the app to have "Variables: read and write" on this repo.
      # Falls back to no token (publish step skipped) when the app isn't set.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        id: app-token
        if: ${{ vars.QNSC_AUTOMATION_APP_ID != '' }}
        continue-on-error: true
        with:
          app-id: ${{ vars.QNSC_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.QNSC_AUTOMATION_PRIVATE_KEY }}

      # Sync the infra IDs the deploy workflows read (backend-deploy.yml,
      # web-deploy.yml) straight from Terraform outputs, so a rebuild that changes
      # subnet/SG/Pages IDs can never leave the vars stale. Skipped automatically when
      # no app token could be minted.
      #
      # A write can still be rejected — an App installation token needs the
      # "Variables: read and write" grant, and cannot write to a protected environment
      # at all. That is surfaced as a visible ::warning:: naming each variable to
      # reconcile, never a silent green, but it never blocks the apply. This step used
      # `continue-on-error`, which turned exactly that case into a green run with stale
      # variables the deploy would then read.
      - name: Publish infra IDs to develop environment variables
        if: ${{ steps.app-token.outputs.token != '' }}
        working-directory: infra/live/develop
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          missed=0
          set_var() {
            if gh variable set "$1" --env develop --repo "$REPO" --body "$2"; then
              echo "  set $1"
            else
              echo "::warning title=infra-id publish::could not set '$1' on the develop environment — reconcile manually: gh variable set $1 --env develop --repo $REPO --body '$2'"
              missed=1
            fi
          }
          set_var ECS_CLUSTER           "$(tofu output -raw ecs_cluster_name)"
          set_var ECS_API_SERVICE       "$(tofu output -raw ecs_api_service)"
          set_var ECS_WORKER_SERVICE    "$(tofu output -raw ecs_worker_service)"
          set_var ECS_MIGRATOR_TASK_DEF "$(tofu output -raw ecs_migrator_task_def)"
          set_var ECS_MIGRATOR_SUBNET   "$(tofu output -json private_subnet_ids | jq -r 'join(",")')"
          set_var ECS_MIGRATOR_SG       "$(tofu output -raw sg_app_id)"
          set_var PAGES_PROJECT         "$(tofu output -raw web_pages_project)"
          if [[ $missed -ne 0 ]]; then
            echo "::warning title=infra-id publish::One or more develop infra-ID vars were not auto-published — the deploy reads these, so verify they match Terraform outputs to avoid drift."
          fi

  # ── TEMPORARY — DELETE AFTER THE OPSHUB PROD TEARDOWN LANDS ─────────────────
  # The only remaining prod action. workflow_dispatch ONLY (the tag trigger and
  # apply-prod job are gone), behind the same `production` Environment reviewer,
  # running the same guard chain: plan → plan-guard → destructive-guard →
  # apply THAT plan. infra/live/prod is an empty configuration, so the plan is
  # a full-state prune; every gated destroy must be declared in the stack's
  # `.allow-data-destroy` or plan-guard refuses. Prereqs (by hand, in order):
  # final RDS snapshot, --no-deletion-protection, uploads bucket verified
  # empty — see infra/live/prod/main.tf.
  destroy-prod:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.destroy_prod }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
      pull-requests: read # destructive-guard reads the labels of the merged PR
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false

      - uses: quynhonsemiconductor/ci/actions/setup-tofu-aws@691668f7a1bd4f4a3416f9224ae7ff7ebe831a3a # v1.23.0
        with:
          role-arn: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/opshub-github-infra-apply
          aws-region: ${{ env.AWS_REGION }}
          tofu-version: ${{ env.TOFU_VERSION }}

      - name: tofu init
        working-directory: infra/live/prod
        run: tofu init -input=false

      - name: tofu plan (saved as tfplan)
        working-directory: infra/live/prod
        run: tofu plan -input=false -out=tfplan
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_grafana_alerting_auth: ${{ secrets.GRAFANA_ALERTS_TOKEN }}

      - name: plan-guard (tfplan)
        uses: quynhonsemiconductor/ci/actions/plan-guard@691668f7a1bd4f4a3416f9224ae7ff7ebe831a3a # v1.23.0
        with:
          plan-file: tfplan
          working-directory: infra/live/prod

      - name: destructive-guard (tfplan)
        uses: quynhonsemiconductor/ci/actions/destructive-guard@691668f7a1bd4f4a3416f9224ae7ff7ebe831a3a # v1.23.0
        with:
          working-directory: infra/live/prod
          plan-file: tfplan
          dispatch-allow: ${{ inputs.allow_destructive }}

      - name: tofu apply (the saved plan)
        working-directory: infra/live/prod
        run: tofu apply -input=false tfplan
