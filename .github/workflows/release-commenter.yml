# =============================================================================
# Release Commenter — thin caller of the shared reusable (ci). When a
# GitHub Release is published, back-comments on every PR merged since the last
# release and adds a "released: vX.Y.Z" label (semantic-release bot UX).
# =============================================================================
name: Release Commenter

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  comment:
    uses: quynhonsemiconductor/ci/.github/workflows/release-commenter.yml@400b7e9868e9ba6d172d956a08041ba19b574689 # v1.33.1
    permissions:
      contents: read
      pull-requests: write
      issues: write
