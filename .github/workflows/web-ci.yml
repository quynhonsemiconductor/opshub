# =============================================================================
# Web · CI — browser end-to-end flows against a live API and a seeded database
#
# The SPA had NO workflow of its own. Its typecheck/lint run inside the backend
# build and `codegen:check` used to live in Backend · CI (it now runs below), but nothing ever opened a
# browser: every screen was unverified above the API boundary, so a broken auth
# bootstrap, a form that posts the wrong shape, or a list that never re-fetches
# shipped green.
#
# This job boots Postgres + Valkey, migrates and seeds, starts the API on 3001,
# then runs Playwright — whose config starts the Vite dev server itself and
# proxies /v1 to the API, exactly as local development does.
# =============================================================================
name: Web · CI

on:
  push:
    branches: [main]
  pull_request:
    # NO `branches:` filter here, deliberately — see `push` above, which keeps one.
    #
    # On `pull_request` this filter matches the PR's BASE branch, which is a different
    # question from `push`'s. Set to [main] it means "only run when this PR is aimed at
    # main", so a PR aimed anywhere else — a stacked PR, aimed at the branch below it —
    # got no CI at all, silently, while still reporting green. rova's eight-PR Phase 7
    # stack sat in exactly that state: seven of eight ran nothing but PR-title and labeler.
    #
    # `main` is this repo's only long-lived branch, so the filter skipped nothing anyone
    # wanted skipped. No upside, one silent failure mode.
    # NOT `edited`, matching Backend · CI. With `cancel-in-progress` below, editing a PR
    # title or body would cancel the in-flight real run and replace it with one that
    # skipped everything — and GitHub counts a skipped required check as passing, so the
    # PR would go green having executed nothing. Every run here is a real one.
    types: [opened, synchronize, reopened]

concurrency:
  # A PUSH TO MAIN IS NEVER CANCELLED, and that takes a group of its own per commit. The group used to be
  # `ci-web-${{ github.ref }}` with cancel-in-progress, so two commits landing on main close together shared
  # `ci-web-refs/heads/main` and the second CANCELLED the first's run. The first commit's deploy then failed its
  # "wait for Web · CI on this commit" gate: a green commit that could not deploy ("Canceling since a higher
  # priority waiting request for ci-web-refs/heads/main exists").
  #
  # `cancel-in-progress: false` alone would NOT have fixed it: GitHub keeps ONE pending run per group and cancels
  # every other pending one, so a third push still killed the second's run. Only a distinct group per commit
  # keeps them all.
  #
  #   pull_request -> one group per PR, cancel in progress (a newer push to the PR supersedes the older run:
  #                   unchanged behaviour; refs/pull/N/merge was already per PR)
  #   push (main)  -> one group per COMMIT, never cancelled
  #   anything else (schedule, dispatch) -> its own run id, so it can neither cancel nor be cancelled by a push
  #
  # `pr-title.yml` deliberately has its own group and is unaffected.
  group: ci-web-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || (github.event_name == 'push' && format('main-{0}', github.sha) || format('{0}-{1}', github.event_name, github.run_id)) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: read # pull @quynhonsemiconductor/* from GitHub Packages

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '10.33.2'

jobs:
  # Does this pull request change anything this workflow tests? A change that touches only files the matching DEPLOY workflow ignores
  # (its `paths-ignore`) cannot affect what this workflow builds, so the heavy jobs are skipped and one cheap gate reports instead.
  # A push to main ALWAYS runs everything (deploys wait for that run), and every doubt (API error, empty file list, any file not on
  # the list) runs everything too: see actions/changed-paths in the ci repo.
  # WEB CI IGNORES ONLY DOCS. Its E2E job builds and runs the REAL API and migrations, the only full-stack end-to-end in the repo, so
  # a change to apps/api, libs or db must still run it. (Backend CI can skip web-only changes; the reverse is not true.)
  changes:
    name: Which parts changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.paths.outputs.run }}
    steps:
      - id: paths
        uses: quynhonsemiconductor/ci/actions/changed-paths@v1
        with:
          ignore: |
            **/*.md
            docs/**
            .claude/**
          # A release-please PR: only when the author is the release bot (a branch name is chosen by whoever opens the PR, so the
          # prefix alone proves nothing) AND the diff is the changelog, the manifest and `version` lines. The push to main it becomes
          # runs everything. Renovate PRs are NOT skipped: an action bump must be exercised on its PR.
          skip-heads: |
            release-please--@qnsc-automation[bot]=CHANGELOG.md,.release-please-manifest.json,version-only:**/package.json

  # ─────────────────────────────────────────────────────────────────────────
  # 1. Lint + typecheck (fast gate — no deps needed)
  # ─────────────────────────────────────────────────────────────────────────
  quality:
    name: Lint & typecheck
    needs: [changes]
    if: ${{ needs.changes.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Authenticates pnpm against GitHub Packages for @quynhonsemiconductor/* (see .npmrc).
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: quynhonsemiconductor/ci/actions/setup-node-pnpm@v1
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      - name: Lint
        run: pnpm --filter opshub-web lint

      - name: Typecheck
        run: pnpm --filter opshub-web typecheck

  # ─────────────────────────────────────────────────────────────────────────
  # 2. Unit tests (no DB — pure component/hook/util tests)
  # ─────────────────────────────────────────────────────────────────────────
  test:
    name: Unit tests
    needs: [changes]
    if: ${{ needs.changes.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Authenticates pnpm against GitHub Packages for @quynhonsemiconductor/* (see .npmrc).
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      has_tests: ${{ steps.detect.outputs.has_tests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: quynhonsemiconductor/ci/actions/setup-node-pnpm@v1
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      - name: Detect unit tests
        id: detect
        shell: bash
        run: |
          if find apps/web/src -type f \( -name '*.test.ts' -o -name '*.test.tsx' -o -name '*.spec.ts' -o -name '*.spec.tsx' \) | grep -q .; then
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Unit tests (with coverage)
        if: steps.detect.outputs.has_tests == 'true'
        run: pnpm --filter opshub-web test:cov

      - name: Skip empty test suite
        if: steps.detect.outputs.has_tests != 'true'
        run: echo "No unit test files found. Skipping Vitest coverage job."

      - name: Upload coverage
        if: always() && steps.detect.outputs.has_tests == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────
  # 3. Vite build — verifies the production bundle compiles cleanly.
  #    Publishes the dist as an artifact for the deploy job to consume.
  # ─────────────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [quality, test]
    timeout-minutes: 20
    env:
      # Authenticates pnpm against GitHub Packages for @quynhonsemiconductor/* (see .npmrc).
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: quynhonsemiconductor/ci/actions/setup-node-pnpm@v1
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      - name: Build
        run: pnpm --filter opshub-web build

      - name: Upload dist artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 3

  # ─────────────────────────────────────────────────────────────────────────
  # 4. E2E (Playwright) — full-stack flows against a live API + seeded DB.
  # ─────────────────────────────────────────────────────────────────────────
  e2e:
    name: E2E (Playwright)
    needs: [changes]
    if: ${{ needs.changes.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: opshub_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: valkey/valkey:8.1.10-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

      # OBJECT STORAGE, because without it this job could not see uploads at all.
      #
      # `StorageService` stubs every presign when `S3_FILES_BUCKET` is unset, so the upload specs
      # answered 500 here while passing locally — and that blind spot is exactly how THREE dead
      # upload paths reached main: a missing CSRF header, a CORS allow-list that refused a header the
      # presign signs, and a replacement lookup by key through a by-id finder. None of them are
      # visible without a bucket to PUT to.
      # Image pinned to the SAME MAJOR as docker-compose.dev.yml. Not a preference — MEASURED. With
      # identical bucket CORS applied, the browser's preflight for the presigned PUT is:
      #
      #   LocalStack 3 → 403 AccessForbidden "CORSResponse: This CORS request is not allowed"
      #   LocalStack 4 → 200
      #
      # …for `Access-Control-Request-Headers: content-type,content-disposition`. On `:3` the presign
      # therefore succeeded and the PUT produced no response at all, which surfaced as a
      # `waitForResponse` timeout rather than anything naming CORS. Reproduced by running both majors
      # side by side locally before changing this line.
      localstack:
        image: localstack/localstack:4
        env:
          SERVICES: s3
          AWS_DEFAULT_REGION: ap-southeast-1
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          DEBUG: '0'
        ports: ['4566:4566']
        options: >-
          --health-cmd "curl -sf http://localhost:4566/_localstack/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    env:
      # Authenticates pnpm against GitHub Packages for @quynhonsemiconductor/* (see .npmrc).
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Shared by migrate/seed and the API process. Connects as the owner rather than the
      # restricted role: Backend · CI already proves the least-privilege grants are complete,
      # and repeating that here would only add a second way for this job to fail.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/opshub_test?sslmode=disable
      DATABASE_MIGRATION_URL: postgresql://postgres:postgres@localhost:5432/opshub_test?sslmode=disable
      VALKEY_URL: redis://localhost:6379
      # The identity 8 session cache lives in Valkey and the cookie is verified against this secret. The
      # cache degrades to Postgres, but a run without it would exercise a path production does not.
      BETTER_AUTH_SECRET: ci-test-better-auth-secret-min-32-characters-ok
      COOKIE_SECRET: ci-test-cookie-secret-min-32-characters-ok
      CSRF_SECRET: ci-test-csrf-secret-min-32-characters-okay
      CORS_ORIGINS: http://localhost:5173
      # 3001, because apps/web/vite.config.ts proxies /v1 there. A different port here means
      # every request 502s through the proxy and every spec fails on its first assertion.
      PORT: '3001'
      # `POST /api/auth/test-login` (identity 8) loads only with IDENTITY_TEST_LOGIN=enabled AND NODE_ENV
      # exactly `test` or `development`, and it is how global-setup signs in — OpsHub's login page is a
      # single Entra SSO button, and CI has no Entra tenant.
      NODE_ENV: test
      IDENTITY_TEST_LOGIN: enabled
      # The suite drives ~50 specs through four seeded identities in three minutes, and each page load
      # costs about fifteen calls — so the DEFAULT tier's 200/min per user is crossed and whichever
      # request lands next fails a spec that was testing something else. Measured here twice after
      # spreading the load across the seats already fixed it locally.
      #
      # The env schema REFUSES this value above 200 when NODE_ENV=production, so it cannot become a dial
      # in a deployed environment — see `env.schema.ts` and its spec.
      RATE_LIMIT_DEFAULT_LIMIT: '5000'
      RATE_LIMIT_IP_LIMIT: '100000'
      LOG_LEVEL: warn
      OTEL_ENABLED: 'false'
      # Object storage points at LocalStack. `STORAGE_ENDPOINT` and not `AWS_ENDPOINT_URL`:
      # StorageService selects its backend separately, because in production the bucket may live in
      # Cloudflare R2 under different credentials. Path-style addressing, which LocalStack and R2 both
      # require — virtual-host style resolves a bucket subdomain that does not exist here.
      AWS_REGION: ap-southeast-1
      S3_FILES_BUCKET: opshub-files-ci
      STORAGE_ENDPOINT: http://localhost:4566
      STORAGE_ACCESS_KEY_ID: test
      STORAGE_SECRET_ACCESS_KEY: test
      STORAGE_FORCE_PATH_STYLE: 'true'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: quynhonsemiconductor/ci/actions/setup-node-pnpm@v1
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      # `pnpm db:migrate` always ensures the RBAC catalogue, but the login-able DEMO EMPLOYEES
      # are fixtures behind `SEED_ON_DEPLOY` — and `admin@opshub.local`, the principal
      # global-setup signs in as, is one of them. Without this the migrate step succeeds and
      # test-login finds no `identity.user` for the email, so it mints one with a NEW id that matches no employee
      # and every request is refused (the fixtures also create the identity users, with the employees' ids).
      #
      # Safe here, and it has to be explicit: `db/migrate.ts` refuses the fixtures whenever
      # `NODE_ENV=production`, which only deployed migrator tasks set. Backend · CI needs no
      # equivalent because its e2e globalSetup resets and seeds the database itself.
      - name: Migrate + seed database
        run: pnpm db:migrate
        env:
          SEED_ON_DEPLOY: 'true'

      # The bucket AND its CORS rules. The rules are not optional decoration: the browser PUTs
      # straight to the presigned URL, and `presignUpload` signs `content-disposition` as well as
      # `content-type`, so a preflight that allows only Content-Type refuses every upload with an
      # opaque `net::ERR_FAILED`. Mirrors scripts/localstack/01-bootstrap.sh and the app-bucket
      # module's `cors_rules`; the origin is the Vite dev server Playwright starts.
      - name: Create the CI bucket
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: ap-southeast-1
        run: |
          aws --endpoint-url http://localhost:4566 s3api create-bucket \
            --bucket opshub-files-ci \
            --region ap-southeast-1 \
            --create-bucket-configuration LocationConstraint=ap-southeast-1
          aws --endpoint-url http://localhost:4566 s3api put-bucket-cors \
            --bucket opshub-files-ci \
            --cors-configuration '{
              "CORSRules": [{
                "AllowedMethods": ["PUT", "GET", "HEAD"],
                "AllowedOrigins": ["http://localhost:5173"],
                "AllowedHeaders": ["Content-Type", "Content-Disposition"],
                "ExposeHeaders": ["ETag"],
                "MaxAgeSeconds": 3600
              }]
            }'

      - name: Build API
        run: pnpm build:api

      - name: Start API (background)
        run: |
          node --enable-source-maps dist/apps/api/apps/api/src/main.js > /tmp/api.log 2>&1 &
          echo "Waiting for API health..."
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3001/v1/healthz >/dev/null 2>&1; then
              echo "API up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "API failed to start"; cat /tmp/api.log; exit 1

      # The SPA's API client is generated from the API's OpenAPI spec and COMMITTED, so it can silently fall behind a DTO change, or be
      # hand-edited, with nothing to notice: `tsc` can pass against stale build info and a route the client has never heard of only fails
      # at runtime. Regenerating from the running API and diffing is the cheapest proof the two agree. This used to run in Backend CI,
      # which skips web-only changes; it lives here, next to the running API, so it runs for every change to either side.
      # Fix a failure with `pnpm --filter opshub-web codegen` against a local API, then commit.
      - name: Generated web client matches the spec
        run: |
          curl -sf http://localhost:3001/api/docs-json -o "$RUNNER_TEMP/openapi.json"
          pnpm --filter opshub-web codegen:check
        env:
          OPENAPI_SPEC: ${{ runner.temp }}/openapi.json

      # ── Playwright browser ────────────────────────────────────────────────────
      #
      # CACHED, AND WITH ITS OWN TIMEOUT, because this step is the only part of this job that has ever
      # failed for a reason unrelated to the code.
      #
      # It downloads Chromium from the Playwright CDN on every run. Measured across nineteen runs: 20-35s
      # when the CDN is healthy, 248s / 301s / 336s when it is not, and twice it simply hung -- 1441s and
      # 1446s -- until the job's 25-minute budget ran out. Both of those surfaced as a CANCELLED job with
      # the tests never started, which reads exactly like a flaky suite and is nothing of the kind.
      #
      # The cache key is the Playwright package version, because that is what decides the browser build.
      # Keying on a lockfile hash instead would miss the cache on every unrelated dependency change; on
      # the version alone, a Playwright upgrade downloads once and every later run is a hit.
      - name: Resolve the Playwright version
        id: playwright
        run: |
          version=$(node -p "require('./apps/web/node_modules/@playwright/test/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # The deps flag stays on a cache hit: the cache carries the BROWSER, while --with-deps installs the
      # OS libraries it links against, which live outside that path. Playwright skips the download when
      # the browser is already present, so a hit costs only the apt step.
      #
      # The step timeout is the important half. Without it a hung download eats the job budget and the
      # failure is reported as a cancellation of the whole job; with it the step fails in eight minutes
      # naming itself, and a re-run becomes a decision rather than a guess.
      - name: Install Playwright browser
        timeout-minutes: 8
        run: pnpm --filter opshub-web exec playwright install --with-deps chromium

      - name: Run browser E2E
        run: pnpm --filter opshub-web exec playwright test --reporter=line

      - name: Upload Playwright artefacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: apps/web/test-results/
          retention-days: 7

      # The API log is the only place a 500 behind a failed assertion is visible: Playwright
      # reports "element not found", not why the request failed.
      - name: API logs on failure
        if: failure()
        run: cat /tmp/api.log || true

  # ─────────────────────────────────────────────────────────────────────────
  # 5. Local quickstart — the README's "Local stack", executed.
  #
  # A clean clone must run with `cp .env.example .env` and the README's commands, nothing else. This job IS that
  # clone: it copies the example, starts the compose stack, migrates (and seeds the demo users), boots the API and the
  # worker from that `.env` with the README's own start scripts, boots the Vite server, and signs in with the test
  # login THROUGH the Vite proxy. Every other job passes its configuration as `env:` and would stay green while
  # `.env.example` rotted; this one reads nothing else.
  #
  # What it caught on the day it was written: PORT=3000 against a Vite proxy to :3001 (every SPA request 502), no
  # SEED_ON_DEPLOY (no demo users, every test login refused). It lives in WEB CI rather than Backend CI because the
  # drift runs both ways: a proxy-port edit in apps/web touches no backend file, and Backend CI skips web-only changes.
  #
  # The commands below mirror the README (test/env-example.spec.ts fails when the two stop agreeing).
  # ─────────────────────────────────────────────────────────────────────────
  quickstart:
    name: local quickstart
    needs: [changes]
    if: ${{ needs.changes.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      LOGS: ${{ github.workspace }}/quickstart-logs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: quynhonsemiconductor/ci/actions/setup-node-pnpm@v1
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      - name: cp .env.example .env
        run: |
          cp .env.example .env
          mkdir -p "$LOGS"

      # `--wait` returns when every healthcheck passes; LocalStack's means the init hook has created the bucket.
      - name: docker compose -f docker-compose.dev.yml up -d --wait
        run: docker compose -f docker-compose.dev.yml up -d --wait --wait-timeout 240

      - name: pnpm db:migrate
        run: pnpm db:migrate

      # `SEED_ON_DEPLOY=true` in the example is what makes the migrate step load the demo users. Without them the test
      # login is refused, so ask the database directly and fail by name rather than at a 401 later.
      - name: The demo users exist
        run: |
          n=$(docker exec opshub-postgres psql -U opshub -d opshub -Atc "select count(*) from identity.\"user\" where email = 'admin@opshub.local'")
          echo "admin@opshub.local rows: $n"
          test "$n" = 1

      - name: Start the API, the worker and the web dev server
        run: |
          nohup pnpm start:dev        > "$LOGS/api.log"    2>&1 &
          nohup pnpm start:dev:worker > "$LOGS/worker.log" 2>&1 &
          nohup pnpm dev:web          > "$LOGS/web.log"    2>&1 &

      # /readyz is the API's own probe (database and cache both up).
      - name: The API answers /readyz
        run: |
          for _ in $(seq 1 90); do
            if body=$(curl -sf http://localhost:3001/readyz); then
              echo "$body"
              echo "$body" | jq -e '.status == "ok" and .checks.database == "up" and .checks.cache == "up"'
              exit 0
            fi
            sleep 2
          done
          echo "::error::the API did not answer /readyz on :3001 within 3 minutes. Is PORT in .env.example the port the Vite proxy forwards to?"
          exit 1

      # The worker serves no HTTP, and `nest start --watch` keeps running after a config refusal, so the log is the
      # signal: it must say it started and must not contain an error (a refusal names the variable).
      - name: The worker started from the same .env
        run: |
          for _ in $(seq 1 60); do
            grep -q "Worker process started" "$LOGS/worker.log" && break
            sleep 2
          done
          grep -q "Worker process started" "$LOGS/worker.log" || { echo "::error::the worker did not start"; exit 1; }
          sleep 10
          if grep -aE "ERROR|FATAL" "$LOGS/worker.log" "$LOGS/api.log"; then
            echo "::error::an error in the API or worker log after boot"
            exit 1
          fi

      # THROUGH THE VITE PROXY (:5173), not the API directly: this is the call a browser makes, and it is the one that
      # breaks when the example's PORT and the proxy target disagree.
      - name: Sign in with the test login and make an authenticated /v1 call, through the SPA's proxy
        run: |
          for _ in $(seq 1 30); do curl -sf http://localhost:5173/v1/healthz >/dev/null && break; sleep 2; done
          curl -sf http://localhost:5173/v1/healthz || { echo "::error::/v1 through the Vite proxy failed: .env.example PORT must equal the proxy target in apps/web/vite.config.ts"; exit 1; }
          curl -sf -c "$LOGS/jar.txt" -H 'content-type: application/json' \
            -d '{"email":"admin@opshub.local"}' http://localhost:5173/api/auth/test-login
          me=$(curl -sf -b "$LOGS/jar.txt" http://localhost:5173/v1/auth/me)
          echo "$me" | jq '{email, roles}'
          echo "$me" | jq -e '.email == "admin@opshub.local" and (.roles | index("admin"))'
          curl -sf -b "$LOGS/jar.txt" -o /dev/null -w 'GET /v1/assets -> %{http_code}\n' http://localhost:5173/v1/assets

      - name: Logs
        if: always()
        run: |
          for f in api worker web; do echo "::group::$f.log"; tail -n 120 "$LOGS/$f.log" || true; echo "::endgroup::"; done
          docker compose -f docker-compose.dev.yml ps || true

      - name: Tear down
        if: always()
        run: |
          pkill -f "nest start" || true
          pkill -f vite || true
          docker compose -f docker-compose.dev.yml down -v || true

  # ── The aggregate gate ──────────────────────────────────────────────────────
  # `Web CI required` is THE required check for this workflow. It exists because GitHub counts a
  # SKIPPED or CANCELLED required check as PASSING, so naming each job in the ruleset
  # cannot catch a job that never ran — the failure mode behind opshub #110 (a title edit
  # cancelled the real run; the replacement skipped every heavy job and went green) and
  # rova #558-#590 (a base-branch filter skipped both CI workflows for stacked PRs, leaving
  # five PRs on 5/5 green with no tests, build, E2E or security scan).
  #
  # `if: always()` is mandatory — without it the gate skips as soon as a dependency fails
  # and inherits the very bug it closes. A cancelled WORKFLOW cancels the gate rather than
  # failing it, so a run superseded by `cancel-in-progress` leaves no red check behind.
  #
  # `needs` MUST list every job that is expected to run. A job outside `needs` is a job
  # outside the gate.
  #
  # Named distinctly from backend-ci.yml's gate: both workflows publish a
  ci-required:
    name: Web CI required
    if: always()
    needs: [changes, quality, test, build, e2e, quickstart]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # No `allow-skipped`, so a renamed or removed job still fails loudly. The two branches are exclusive:
      #  * `changes` said run: every job must be `success`;
      #  * otherwise: only `changes` itself must be `success` (the rest are skipped by design). If `changes` FAILED its output is
      #    empty, this branch runs, and the gate fails: it cannot turn "could not decide" into a pass.
      - name: Every job must have succeeded
        if: ${{ needs.changes.outputs.run == 'true' }}
        uses: quynhonsemiconductor/ci/actions/assert-jobs-succeeded@v1
        with:
          results: ${{ join(needs.*.result, ',') }}

      - name: Nothing here to test (every changed file is ignorable)
        if: ${{ needs.changes.outputs.run != 'true' }}
        uses: quynhonsemiconductor/ci/actions/assert-jobs-succeeded@v1
        with:
          results: ${{ needs.changes.result }}
