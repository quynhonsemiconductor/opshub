# =============================================================================
# PR Labeler — thin caller of the shared reusable (ci). The label map
# (.github/labeler.yml) stays product-local; this only wires the plumbing.
#
# Also PR size: a size/XS … size/XXL label by the lines of CODE a pull request changes, from
# quynhonsemiconductor/ci `actions/pr-size`. Tests, docs, lockfiles and generated files are reported
# but not counted. ADVISORY: above 1,000 lines of code it comments suggesting a split; above 2,500 it
# also says the AI review only runs on opened / reopened / ready_for_review. It does not fail.
# rova#653 (4,656 lines of code, ten user stories in one pull request) is the case it exists for.
#
# HERE, and AFTER the labeler, rather than in a workflow of its own: actions/labeler replaces the
# whole label set from a snapshot it takes when it starts, so a size label added while it runs is
# removed (opshub#348: added 12:00:59, removed 12:01:00). `needs:` serialises the two.
#
# A local job calling the action, not a reusable workflow, so the check reports as `PR size` — the
# name a ruleset would require if this is ever made blocking (ci/README).
# =============================================================================
name: PR Labeler

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: labeler-${{ github.ref }}
  cancel-in-progress: true

jobs:
  labeler:
    uses: quynhonsemiconductor/ci/.github/workflows/labeler.yml@v1
    permissions:
      contents: read
      pull-requests: write

  size:
    name: PR size
    needs: labeler
    # A failed area labeler is no reason to skip the size label.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write # labels and the size comment
    steps:
      - uses: quynhonsemiconductor/ci/actions/pr-size@v1
