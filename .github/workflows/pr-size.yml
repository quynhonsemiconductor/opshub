# =============================================================================
# PR size — label a pull request size/XS … size/XXL by the lines of CODE it changes.
#
# The check lives in quynhonsemiconductor/ci (`actions/pr-size`); thresholds and what counts as code
# are decided there, once, for every repository. Tests, docs, lockfiles and generated files are
# reported but not counted.
#
# ADVISORY. Above 1,000 lines of code it comments suggesting a split; above 2,500 it also says the AI
# review only runs on opened / reopened / ready_for_review. It does not fail. rova#653 (4,656 lines of
# code, ten user stories in one pull request) is the case it exists for.
#
# The action, not a reusable workflow, so the check reports as `PR size` — the name a ruleset would
# require if this is ever made blocking (see ci/README: a required check must be a composite action).
# =============================================================================
name: PR size

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-size-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write # labels and the size comment

jobs:
  size:
    name: PR size
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: quynhonsemiconductor/ci/actions/pr-size@v1
