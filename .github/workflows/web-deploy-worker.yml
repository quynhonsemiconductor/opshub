# =============================================================================
# Web · Deploy Worker — publish the SPA to Cloudflare Workers Static Assets
# (the on-prem edge, ONPREM-PLAN §8.2).
#
# WHY IT EXISTS: the on-prem design serves opshub.qnsc.vn SAME-ORIGIN. A
# Worker named `opshub-prod-web` holds `<host>/*`; `/api/auth/*`, `/v1/*` and
# `/readyz` are Workers routes WITHOUT a script, so Cloudflare sends them
# through the qnsc-apps tunnel to the API (infra `live/edge/onprem.tf`). The
# old Pages deploy was removed with the AWS exit (opshub#515).
#
# DEV RETIRED (2026-11-04): opshub-dev.qnsc.vn is served from the cluster since
# infra#355 (`web = "cluster"` — no Workers routes), so this workflow no longer
# deploys on push to main. The `opshub-dev-web` script stays deployed in
# Cloudflare as the rollback until 2026-11-11, then the owner deletes it.
#
# TRIGGERS
#   prod    → workflow_dispatch with environment=production ONLY, and only while
#             the repository variable WEB_WORKER_PROD_ENABLED is `true`. That
#             variable stays unset until the prod move (ONPREM-PLAN M-11): prod
#             is still served elsewhere, and a Worker deployed there would have
#             no route until the live/edge cutover applies one.
#
# WHAT IT DOES NOT DO: no DNS, no Workers routes, no Access. Those are `infra`
# `live/edge`, applied (and reviewed) by the SA. The token here is Workers
# Scripts: edit on the QNSC account and nothing else — `wrangler.jsonc`
# deliberately declares no routes, so a deploy cannot race Terraform, and a
# token without Zone permission cannot fail on one.
# =============================================================================
name: Web · Deploy Worker

on:
  workflow_dispatch:
    inputs:
      environment:
        description: >-
          Cloudflare target. Only `production` remains; it is refused unless the
          WEB_WORKER_PROD_ENABLED repository variable is true (the prod move).
        type: choice
        options: [production]
        default: production

concurrency:
  # One deploy per target; never cancel a running one.
  group: deploy-web-worker-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  # 24, matching .nvmrc, web-ci.yml and the Dockerfile.
  NODE_VERSION: '24'

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Resolve the target script and hold the prod gate.
  #
  # The gate is a VARIABLE, not the input alone: a workflow_dispatch can name
  # `production`, and until the prod move that would deploy a script nothing
  # routes to (and, worse, teach people the target works). `WEB_WORKER_PROD_ENABLED`
  # is unset until the move, which keeps prod off by default.
  # ───────────────────────────────────────────────────────────────────────────
  target:
    name: Resolve target
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      environment: ${{ steps.resolve.outputs.environment }}
      wrangler_env: ${{ steps.resolve.outputs.wrangler_env }}
      script: ${{ steps.resolve.outputs.script }}
    steps:
      - id: resolve
        name: Resolve the script name, and refuse prod while it is off
        env:
          INPUT_ENV: ${{ inputs.environment }}
          PROD_ENABLED: ${{ vars.WEB_WORKER_PROD_ENABLED }}
        run: |
          set -euo pipefail
          environment="${INPUT_ENV:-production}"

          case "${environment}" in
            production)
              if [ "${PROD_ENABLED}" != "true" ]; then
                echo "::error::production is refused: the on-prem prod move has not happened. Set the vars.WEB_WORKER_PROD_ENABLED repository variable to true only in the prod-move change (ONPREM-PLAN M-11), after live/edge routes the prod host to opshub-prod-web."
                exit 1
              fi
              wrangler_env=prod
              script=opshub-prod-web
              ;;
            *)
              echo "::error::unknown environment '${environment}' (expected production; dev is served from the cluster since infra#355)."
              exit 1
              ;;
          esac

          {
            echo "environment=${environment}"
            echo "wrangler_env=${wrangler_env}"
            echo "script=${script}"
          } >> "$GITHUB_OUTPUT"
          echo "Deploying ${script} from environment ${environment}."

  # ───────────────────────────────────────────────────────────────────────────
  # CI gate — a red main must not deploy, and a hand-dispatch must not ship a
  # commit CI never saw. Keyed on the commit sha (never an unrelated run) and
  # narrowed to `main` so a tag or a branch run of the same file cannot be found
  # instead. Fails closed when no run exists.
  #
  # `wait-for-run` first shipped in ci v1.29.0; the whole repo now pins v1.31.2,
  # which provides it.
  # ───────────────────────────────────────────────────────────────────────────
  wait-for-ci:
    name: Wait for Web · CI
    needs: [target]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - name: Wait for Web · CI on this commit
        uses: quynhonsemiconductor/ci/actions/wait-for-run@400b7e9868e9ba6d172d956a08041ba19b574689 # v1.33.1
        with:
          workflow: web-ci.yml
          branch: main
          label: Web · CI
          if-missing: fail
          missing-message: >-
            No Web · CI run was found for this commit. Pushing to main always runs it; a
            workflow_dispatch on a commit CI never saw is refused rather than shipped blind.

  # ───────────────────────────────────────────────────────────────────────────
  # Build and deploy.
  #
  # The build is SAME-ORIGIN: the runtime config written into dist/ below has an empty
  # `apiBaseUrl`, so the SPA calls its own host (`/v1/*`, `/api/auth/*`), which the edge routes
  # to the API. Nothing in the bundle reads an API origin or a Pages variable.
  #
  # wrangler is an EXACT devDependency of opshub-web (4.149.0) and is run from
  # the workspace, never `npx wrangler@latest`: the deploy must ship with the
  # bundler the lockfile pinned.
  # ───────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy ${{ needs.target.outputs.script }}
    needs: [target, wait-for-ci]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The GitHub Environment carries CLOUDFLARE_WORKERS_API_TOKEN (owner-set:
    # Workers Scripts: edit on the QNSC account, no DNS, no routes, no Pages).
    # DELIBERATELY NOT `CLOUDFLARE_API_TOKEN`: that name is an ORG secret holding
    # the Pages deploy token, and `secrets.*` falls through to it whenever the
    # environment has none of its own — so this job would have deployed with the
    # Pages credential and said nothing. A name of its own fails closed (empty)
    # instead. `production` also carries the required reviewer, which is what
    # turns the dispatch into a human-gated ship once the variable above is flipped.
    environment: ${{ needs.target.outputs.environment }}
    permissions:
      contents: read
      packages: read # @quynhonsemiconductor/* from GitHub Packages
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: quynhonsemiconductor/ci/actions/setup-node-pnpm@400b7e9868e9ba6d172d956a08041ba19b574689 # v1.33.1
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Require the Workers token for this environment
        # Fail here, naming the secret and the environment, rather than inside
        # wrangler's own error — an empty `secrets.*` is the one failure mode
        # that looks like a Cloudflare problem.
        env:
          CLOUDFLARE_WORKERS_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          TARGET_ENV: ${{ needs.target.outputs.environment }}
        run: |
          set -euo pipefail
          [ -n "${CLOUDFLARE_WORKERS_API_TOKEN}" ] || {
            echo "::error::secrets.CLOUDFLARE_WORKERS_API_TOKEN is not set in the '${TARGET_ENV}' environment. Create it there (Workers Scripts: edit on the QNSC account) before deploying."
            exit 1
          }

      - name: Build the SPA for the same-origin edge
        run: pnpm --filter opshub-web build

      # The SPA reads /config.json at boot and a Workers Static Assets deploy serves only files in
      # dist/. The cluster image gets that file from a ConfigMap; the Worker has no mount, so the
      # deploy writes the same contract per target here. It is NOT committed: a file in the repo
      # would be served to whichever environment built it.
      #
      # apiBaseUrl is empty and devLoginEnabled false, reproducing what the old build-time
      # VITE_API_URL='' / absent VITE_DEV_LOGIN produced for this deploy: same-origin, dev login off.
      - name: Write the runtime config into the bundle
        env:
          WRANGLER_ENV: ${{ needs.target.outputs.wrangler_env }}
        run: |
          set -euo pipefail
          case "${WRANGLER_ENV}" in
            prod) app_env=production ;;
            *) echo "::error::unknown wrangler env '${WRANGLER_ENV}'"; exit 1 ;;
          esac
          jq -n --arg app_env "${app_env}" \
            '{apiBaseUrl: "", appEnv: $app_env, devLoginEnabled: false}' \
            > apps/web/dist/config.json

      - name: Deploy ${{ needs.target.outputs.script }}
        # `pnpm --filter` runs inside apps/web, where wrangler discovers
        # wrangler.jsonc and resolves `assets.directory = ./dist`. `--env` picks
        # the script (`opshub-prod-web`); never omit it — the top-level name in
        # the config is not a deploy target.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_ENV: ${{ needs.target.outputs.wrangler_env }}
        run: >-
          pnpm --filter opshub-web exec wrangler deploy
          --env "$WRANGLER_ENV"
