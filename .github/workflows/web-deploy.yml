# =============================================================================
# Web · Deploy — thin caller of the shared reusable (ci).
#
# Triggers:
#   develop → push to main (auto)
#   (prod is GONE — destroyed 2026-10-21 with the AWS opshub production stack;
#    the v*.*.* tag trigger and its "production" Environment gate were removed
#    with it.)
#
# The reusable builds the Vite bundle and publishes it to Cloudflare Pages.
# VITE_*/PAGES_PROJECT/APP_URL are env-scoped GitHub vars; the Cloudflare creds
# (+ optional Slack webhook) are passed explicitly to the reusable
# (least-privilege, no `secrets: inherit`).
# =============================================================================
name: Web · Deploy

on:
  push:
    branches: [main]
    # Skip the develop build+deploy when a merge touches ONLY paths this service
    # doesn't ship: docs and the backend (api/worker/libs/db/Dockerfile/nest
    # config). paths-ignore fires only if EVERY changed file matches — a shared
    # change (root lockfile, package.json) still deploys, so under-deploy is
    # impossible. Release tags always change package.json + manifest (root, never
    # ignored).
    #
    # `infra/**` is deliberately NOT ignored, though it once was. Terraform owns the
    # Pages project's environment (`API_ORIGIN`), and a Pages env change only takes
    # effect on the NEXT deployment — so an infra-only merge left the new value
    # registered and the old one live, with nothing to show anything was wrong.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.claude/**'
      - 'apps/api/**'
      - 'apps/worker/**'
      - 'libs/**'
      - 'db/**'
      - 'Dockerfile'
      - 'nest-cli.json'
      - 'tsconfig.migrator.json'

concurrency:
  # Serialize by ENVIRONMENT. develop only now — the prod path is gone.
  group: deploy-web-develop
  cancel-in-progress: false   # never cancel a running deploy

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Ordering gate — never publish the SPA ahead of its own infrastructure.
  #
  # Mirrors backend-deploy's job of the same name, and exists for the same reason:
  # Terraform owns the Pages project's `API_ORIGIN`, and a Pages env change only
  # reaches the SPA on its next deployment. Now that `infra/**` triggers this
  # workflow, an infra commit would otherwise race its own apply and publish a
  # bundle against the PREVIOUS origin.
  #
  # Deterministic by design, keyed on the commit sha so it can never wait on an
  # unrelated run:
  #   - commit does NOT touch infra/live/** → no infra run exists, proceed at once
  #   - commit DOES touch infra/live/**     → wait for that run on THIS sha
  # ───────────────────────────────────────────────────────────────────────────
  wait-for-infra:
    name: Wait for infrastructure
    runs-on: ubuntu-latest
    # Timing out here is safe — the
    # deploy is re-runnable — but it should not fire because an approver stepped
    # away.
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Does this commit change infrastructure?
        id: touched
        run: |
          # infra/modules/** counts too — `module "stack"` is a LOCAL path module, so a
          # module-only commit changes the plan and triggers infra-apply. Matching only
          # infra/live/ here would let this deploy race ahead of that apply.
          if git diff --name-only HEAD~1 HEAD | grep -qE '^infra/(live|modules)/'; then
            echo "infra=true" >> "$GITHUB_OUTPUT"
          else
            echo "infra=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for Infrastructure · Apply on this commit
        if: steps.touched.outputs.infra == 'true'
        # Shared with backend-deploy and the other repos — see `quynhonsemiconductor/ci`.
        # A rate limit is retried there rather than reported as a failed upstream run.
        uses: quynhonsemiconductor/ci/actions/wait-for-run@208f7081f59fdbe5a454d7e836d1b04ac4b04d97 # v1.24.1
        with:
          workflow: infra-apply.yml
          label: Infrastructure · Apply
          # The run on THIS ref (push to main). `ref_name` is `main`.
          branch: ${{ github.ref_name }}
          if-missing: warn
          missing-message: >-
            infra changed but no Infrastructure · Apply run was found for this commit.

  # ───────────────────────────────────────────────────────────────────────────
  # CI gate — a red main must not deploy.
  #
  # Block the develop (push-to-main) deploy until the "Web · CI" run for THIS
  # commit has finished successfully. Keys on the commit sha, so it can never
  # wait on an unrelated run. Mirrors backend-deploy's wait-for-infra gate.
  #
  #   - push to main → wait for Web · CI on this sha; the shared `wait-for-run` action
  #     propagates its conclusion, so a failed/timed-out CI blocks the deploy.
  #
  # Fails closed: if no CI run is found for the sha, block rather than ship blind.
  # ───────────────────────────────────────────────────────────────────────────
  wait-for-ci:
    name: Wait for Web · CI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Least-privilege: read the commit and query sibling runs. Nothing else.
    permissions:
      contents: read
      actions: read
    steps:
      - name: Wait for Web · CI on this commit
        # Tag deploy: Web · CI does not run on tags, so there is nothing to await (see above).
        if: github.ref_type != 'tag'
        uses: quynhonsemiconductor/ci/actions/wait-for-run@208f7081f59fdbe5a454d7e836d1b04ac4b04d97 # v1.24.1
        with:
          workflow: web-ci.yml
          branch: main
          label: Web · CI
          if-missing: fail
          missing-message: >-
            No Web · CI run was found for this commit.

  deploy:
    needs: [wait-for-infra, wait-for-ci]
    # Must match the UNION of every inner job's own permissions in the reusable
    # web-deploy.yml, not just default (GitHub validates the whole chain at
    # startup) -- packages:read is for the build job's pnpm install of private
    # @quynhonsemiconductor/* packages.
    permissions:
      contents: read
      packages: read
    uses: quynhonsemiconductor/ci/.github/workflows/web-deploy.yml@208f7081f59fdbe5a454d7e836d1b04ac4b04d97 # v1.24.1
    with:
      product: opshub
      # Monorepo: run wrangler from the web package dir so paths resolve against
      # the SPA. web_dist_path is relative to working_directory.
      working_directory: apps/web
      web_dist_path: dist
    # Least-privilege: pass only what the reusable declares (no `secrets: inherit`).
    secrets:
      CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      SLACK_DEPLOY_WEBHOOK:  ${{ secrets.SLACK_DEPLOY_WEBHOOK }}
