# =============================================================================
# Web · Deploy — thin caller of the shared reusable (qnsc-ci).
#
# Triggers:
#   develop → push to main (auto)
#   prod    → push a semver tag v*.*.*  (gated by the "production" GitHub
#             Environment's required reviewer, enforced inside the reusable)
#
# The reusable builds the Vite bundle and publishes it to Cloudflare Pages.
# VITE_*/PAGES_PROJECT/APP_URL are env-scoped GitHub vars; the Cloudflare creds
# (+ optional Slack webhook) are passed explicitly to the reusable
# (least-privilege, no `secrets: inherit`).
# =============================================================================
name: Web · Deploy

on:
  push:
    branches: [main]
    # Skip the develop build+deploy when a merge touches ONLY paths this service
    # doesn't ship: docs and the backend (api/worker/libs/db/Dockerfile/nest
    # config). paths-ignore fires only if EVERY changed file matches — a shared
    # change (root lockfile, package.json) still deploys, so under-deploy is
    # impossible. Release tags always change package.json + manifest (root, never
    # ignored) → prod never skipped.
    #
    # `infra/**` is deliberately NOT ignored, though it once was. Terraform owns the
    # Pages project's environment (`API_ORIGIN`), and a Pages env change only takes
    # effect on the NEXT deployment — so an infra-only merge left the new value
    # registered and the old one live, with nothing to show anything was wrong.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.claude/**'
      - 'apps/api/**'
      - 'apps/worker/**'
      - 'libs/**'
      - 'db/**'
      - 'Dockerfile'
      - 'nest-cli.json'
      - 'tsconfig.migrator.json'
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'   # semver only — no -rc suffix

concurrency:
  # Serialize by ENVIRONMENT, not raw ref: all prod (tag) deploys share one
  # group so prod DB migrations never run concurrently; develop shares another.
  # prod and develop still run in parallel (different groups).
  group: deploy-web-${{ startsWith(github.ref, 'refs/tags/') && 'prod' || 'develop' }}
  cancel-in-progress: false   # never cancel a running deploy

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Ordering gate — never publish the SPA ahead of its own infrastructure.
  #
  # Mirrors backend-deploy's job of the same name, and exists for the same reason:
  # Terraform owns the Pages project's `API_ORIGIN`, and a Pages env change only
  # reaches the SPA on its next deployment. Now that `infra/**` triggers this
  # workflow, an infra commit would otherwise race its own apply and publish a
  # bundle against the PREVIOUS origin.
  #
  # Deterministic by design, keyed on the commit sha so it can never wait on an
  # unrelated run:
  #   - commit does NOT touch infra/live/** → no infra run exists, proceed at once
  #   - commit DOES touch infra/live/**     → wait for that run on THIS sha
  # ───────────────────────────────────────────────────────────────────────────
  wait-for-infra:
    name: Wait for infrastructure
    runs-on: ubuntu-latest
    # Generous: on a tag this waits for apply-prod, which sits behind the
    # `production` environment's required reviewer. Timing out here is safe — the
    # deploy is re-runnable — but it should not fire because an approver stepped
    # away.
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Does this commit change infrastructure?
        id: touched
        run: |
          # Tags ALWAYS gate. infra-apply's apply-prod job is `if: ref_type ==
          # 'tag'`, so a tag is the ONLY thing that applies prod infra — and the
          # prod web deploy fires on the same tag. Path filters are also not
          # applied to tag pushes, so infra-apply always runs for a tag.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "infra=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # infra/modules/** counts too — `module "stack"` is a LOCAL path module, so a
          # module-only commit changes the plan and triggers infra-apply. Matching only
          # infra/live/ here would let this deploy race ahead of that apply.
          if git diff --name-only HEAD~1 HEAD | grep -qE '^infra/(live|modules)/'; then
            echo "infra=true" >> "$GITHUB_OUTPUT"
          else
            echo "infra=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for Infrastructure · Apply on this commit
        if: steps.touched.outputs.infra == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The sibling run may not be registered the instant this job starts;
          # allow a short grace period before concluding there is none.
            # `|| ID=""` keeps a transient gh/API failure from ending the step: these
            # runners use `set -e`, and an assignment takes its command substitution's
            # exit status, so a rate-limited or flaky `gh run list` skipped the retry
            # loop entirely and turned a recoverable blip into a failed gate.
          for _ in $(seq 1 12); do
            ID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow=infra-apply.yml \
                   --commit "$GITHUB_SHA" \
                   --limit 1 --json databaseId --jq '.[0].databaseId // empty') || ID=""
            [ -n "$ID" ] && break
            sleep 10
          done

          if [ -z "${ID:-}" ]; then
            echo "::warning::infra/live changed but no Infrastructure · Apply run found for $GITHUB_SHA — proceeding."
            exit 0
          fi

          echo "Waiting on infra-apply run $ID …"
          gh run watch --repo "$GITHUB_REPOSITORY" "$ID" --exit-status
          echo "Infrastructure applied; deploy may proceed."

  # ───────────────────────────────────────────────────────────────────────────
  # CI gate — a red main must not deploy.
  #
  # Block the develop (push-to-main) deploy until the "Web · CI" run for THIS
  # commit has finished successfully. Keys on the commit sha, so it can never
  # wait on an unrelated run. Mirrors backend-deploy's wait-for-infra gate.
  #
  #   - tag push → CI does not run on tags (it triggers on push-to-main / PRs),
  #     and prod is gated by the "production" Environment reviewer inside the
  #     reusable, so there is nothing to await → proceed at once.
  #   - push to main → wait for Web · CI on this sha; `gh run watch --exit-status`
  #     propagates its conclusion, so a failed/timed-out CI blocks the deploy.
  #
  # Fails closed: if no CI run is found for the sha, block rather than ship blind.
  # ───────────────────────────────────────────────────────────────────────────
  wait-for-ci:
    name: Wait for Web · CI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Least-privilege: read the commit and query sibling runs. Nothing else.
    permissions:
      contents: read
      actions: read
    steps:
      - name: Wait for Web · CI on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "Tag deploy — Web · CI gate not applicable."; exit 0
          fi
          # The sibling run may not be registered the instant this job starts;
          # allow a short grace period before concluding there is none.
          # This job does not check out the repo, so `gh` cannot infer it from a
          # local remote — pass it explicitly.
          for _ in $(seq 1 12); do
            ID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow web-ci.yml \
                   --branch main --commit "$GITHUB_SHA" \
                   --limit 1 --json databaseId --jq '.[0].databaseId // empty') || ID=""
            [ -n "$ID" ] && break
            sleep 10
          done
          if [ -z "${ID:-}" ]; then
            echo "::error::No Web · CI run found for $GITHUB_SHA — blocking deploy (fail closed)."
            exit 1
          fi
          echo "Waiting on Web · CI run $ID …"
          gh run watch --repo "$GITHUB_REPOSITORY" "$ID" --exit-status
          echo "Web · CI succeeded; deploy may proceed."

  deploy:
    needs: [wait-for-infra, wait-for-ci]
    # Must match the UNION of every inner job's own permissions in the reusable
    # web-deploy.yml, not just default (GitHub validates the whole chain at
    # startup) -- packages:read is for the build job's pnpm install of private
    # @qnsc-vn/* packages.
    permissions:
      contents: read
      packages: read
    uses: quynhonsemiconductor/qnsc-ci/.github/workflows/web-deploy.yml@v1
    with:
      product: opshub
      # Monorepo: run wrangler from the web package dir so paths resolve against
      # the SPA. web_dist_path is relative to working_directory.
      working_directory: apps/web
      web_dist_path: dist
    # Least-privilege: pass only what the reusable declares (no `secrets: inherit`).
    secrets:
      CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      SLACK_DEPLOY_WEBHOOK:  ${{ secrets.SLACK_DEPLOY_WEBHOOK }}
