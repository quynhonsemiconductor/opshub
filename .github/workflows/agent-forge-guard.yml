# agent-forge test-guard — a required check on this repository's main branch.
#
# This is the only guardrail agent-forge does not run itself. Layers 1 and 2 (the in-slot hook and the
# orchestrator's diff scan) are the platform judging its own output; if the orchestrator has a bug,
# it is also the thing that would have caught it. This runs where the merge actually happens.
#
# It applies to human pull requests too, deliberately. A check that exempts humans is a check that
# tells an agent to open its pull request as a human.
#
# THE GUARD ITSELF LIVES IN QNSC-VN/qnsc-ci. What used to ship alongside this file was a ~280-line
# Python script, copied into every repository, which then drifted — in the direction nobody watches.
# rally's copy was fixed for a shell injection (a branch name interpolated into a `run:` block,
# flagged by zizmor) and the fix never came back to this template, so every repository onboarded after
# that point would have received the vulnerable version. One copy, versioned with the rest of the
# org's CI, removes that failure mode instead of asking people to remember.
#
# A second consequence, and the better one: the guard is no longer IN the tree an agent writes to.
# agent-forge's layer-2 deny-list still refuses to let an agent touch it, but that is now a second
# line of defence rather than the only one.
#
# THE COMPOSITE ACTION RATHER THAN qnsc-ci's REUSABLE WORKFLOW, and this is not a style choice.
# A job that calls a reusable workflow reports its check as `<caller job>/<called job>` — rally's
# security checks appear as `security / SAST (Semgrep)` for exactly this reason. So the reusable form
# would report `test-guard / test-guard`, and branch protection requiring `test-guard` would match
# nothing. A required check that never reports does not fail; it blocks every merge forever. Calling
# the action keeps the job local, so the check is named `test-guard` and an existing ruleset keeps
# working untouched.
name: agent-forge test-guard

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    # `edited` matters: the approval paths are declared in the pull request BODY, so editing the body
    # to add an approval must re-run the check rather than leaving a red tick nobody can clear.

# NO `concurrency` block, unlike the org's other workflows, and the omission is deliberate.
# A concurrency group with `cancel-in-progress` combined with the `edited` trigger above is the
# exact shape that produced false greens on rally and opshub: an edit cancels the real run and
# GitHub counts the replacement's skipped jobs as passing. That failure needed a second
# ingredient — jobs guarded with `if: action != 'edited'` — which this workflow does not have, so
# it would be safe here today. It is left out anyway, because the guard is a REQUIRED check and
# the cost of being wrong about that reasoning is a merge that passed without being examined.

permissions:
  contents: read

jobs:
  # The job id IS the check name branch protection sees. Do not rename it: GitHub matches required
  # checks by name, and a renamed check stops reporting rather than failing.
  test-guard:
    runs-on: ubuntu-latest
    # A diff and a script. Ten minutes is generous; the point is that a hung required check blocks a
    # merge indefinitely and looks identical to one still running.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          # The guard diffs against the merge base, which does not exist in a shallow clone.
          fetch-depth: 0
          # It reads history and runs a script over attacker-influenced input, and never pushes. A
          # persisted checkout credential would be available to everything that runs afterwards.
          persist-credentials: false

      - name: capture the pull request body
        # Written to a file rather than passed as an argument: a body containing a shell
        # metacharacter would otherwise be interpreted, and the body is attacker-controlled text.
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$PR_BODY" > "${RUNNER_TEMP}/pr-body.txt"

      - uses: QNSC-VN/qnsc-ci/actions/agent-forge-test-guard@v1.13.0
        with:
          # The BRANCH NAME, not a ref: the action prefixes `origin/` itself. It reaches the script
          # through the environment rather than `${{ }}` interpolation, which is the action's job —
          # a branch name is attacker-controlled on a fork pull request.
          base-ref: ${{ github.event.pull_request.base.ref }}
          body-file: ${{ runner.temp }}/pr-body.txt
