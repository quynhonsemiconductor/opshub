# =============================================================================
# PR title — Conventional Commits, checked on its own workflow.
#
# The CHECK ITSELF now lives in quynhonsemiconductor/ci as a composite action. This
# file was 72 lines byte-identical with opshub's, including the incident history
# below, which is now recorded once in the action rather than in every repo.
#
# WHY ITS OWN WORKFLOW, rather than a job inside Backend · CI and Web · CI:
#
# 1. A FALSE GREEN, and the serious one. Those workflows listened for the `edited`
#    pull_request action purely so this check would re-run when a title changed. But
#    they also set `cancel-in-progress: true` and guarded every heavy job with
#    `if: github.event.action != 'edited'`. So editing a PR title or body CANCELLED the
#    real run and replaced it with a run in which Tests, Lint, Migration, Docker and
#    OpenAPI all skipped — and GitHub counts a skipped required check as PASSING. The
#    PR showed all-green having executed nothing. Observed three times on opshub #110.
#
# 2. The check ran TWICE per PR, once from each workflow, with byte-identical config.
#
# WHY THE ACTION AND NOT ci's REUSABLE WORKFLOW: a job that calls a reusable workflow
# reports its check as `<caller job>/<called job>`, which would rename this check and
# leave the ruleset requiring "PR title (conventional commits)" matching nothing. A
# required check that never reports does not fail — it blocks every merge. Calling the
# action keeps the job local, so the name below is the name branch protection sees.
# =============================================================================
name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

concurrency:
  # Deliberately NOT the ci-backend/ci-web group. Sharing one is what let a title edit
  # cancel a test run.
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read # required by the action's underlying semantic-pull-request step

jobs:
  pr-title:
    # This name IS the required check. Do not rename it.
    name: PR title (conventional commits)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # No checkout: the action reads the title from the event payload.
      - uses: quynhonsemiconductor/ci/actions/pr-title-conventional-commits@v1
