# =============================================================================
# CI — fast quality gates on every PR and push to main
# Gate: lint → typecheck → unit tests → e2e tests → docker build → openapi diff
# Security scans live in the Security · Scan workflow — independently runnable.
# =============================================================================
name: Backend · CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # NOT `edited`. That action exists only for the PR-title check, which now lives in
    # pr-title.yml — and listening for it here was actively harmful: combined with
    # `cancel-in-progress: true` below and the `if: action != 'edited'` guards this workflow
    # used to carry, editing a PR title or body CANCELLED the in-flight real run and replaced
    # it with one where every heavy job skipped. GitHub counts a skipped required check as
    # passing, so the PR went green having executed nothing. Every run of this workflow is now
    # a real one.
    types: [opened, synchronize, reopened]

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # No longer for the semantic-PR action — that moved to pr-title.yml, which declares its
  # own. Kept because it is read-only and removing a permission is a bigger claim than
  # this change is making: nothing here needs it today (the openapi job reads
  # `github.event.pull_request.base.sha` straight off the payload, which needs no grant).
  pull-requests: read
  packages: read       # pull @qnsc-vn/* from GitHub Packages

env:
  # 24, matching .nvmrc and the Dockerfile's `ARG NODE_VERSION=24`. Nothing overrides that
  # ARG, so the shipped image runs 24 — while CI ran 22, meaning no suite ever executed on
  # the version production uses.
  #
  # The split was not arbitrary. Node 24's V8 coverage instrumentation counts functions
  # differently and dropped the measured figure to 9.74% against a 10% floor, so bumping
  # this used to turn Tests red. That is fixed: the floors were raised to just under actual
  # (21/21/17/14) and `pnpm check:coverage-floors` now enforces the ratchet the config only
  # described, so the numbers are pinned on whichever runtime measures them.
  #
  # Measured on 24 before bumping: statements 22.27 / branches 18.71 / functions 15.58 /
  # lines 22.35 — every one above its floor and within the 3-point drift tolerance.
  NODE_VERSION: '24'
  PNPM_VERSION: '10.33.2'

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # 1. Lint + typecheck (fast gate — no DB needed)
  # ─────────────────────────────────────────────────────────────────────────
  quality:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: quynhonsemiconductor/qnsc-ci/actions/setup-node-pnpm@v1
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # pull @qnsc-vn/* from GitHub Packages

      - name: Lint
        run: pnpm lint

      - name: Typecheck (shipped sources)
        run: npx tsc -p tsconfig.build.json --noEmit

      - name: Typecheck (including tests)
        # `tsconfig.build.json` excludes `test` and `**/*spec.ts`, so the step above cannot
        # see a type error in a test file. Rally hit exactly this gap (incident #262): a
        # wrong service-call signature reached main behind a green check because the spec
        # mocked the call, so it still passed at runtime with the wrong signature. `tsconfig.json`
        # is a superset, hence both steps rather than a replacement — the first one stays as
        # the fast gate that matches exactly what the Docker build compiles.
        run: pnpm typecheck

  # ─────────────────────────────────────────────────────────────────────────
  # 2. Unit + e2e tests (needs Postgres)
  # ─────────────────────────────────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: opshub_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

      # S3, so the upload surfaces are actually exercised rather than mocked.
      #
      # `training.e2e.spec.ts` PUTs real bytes to a presigned URL and confirms them, which is the
      # only way to prove the things that matter about that path: that the signed header set is the
      # one the client must send, that `Content-Disposition` ends up as STORED object metadata, and
      # that confirm rejects a size or checksum that does not match. Every one of those is invisible
      # to a stubbed StorageService — the stub would agree with whatever the code did.
      localstack:
        # Pinned to the SAME major as docker-compose.dev.yml. They diverged once — CI on 3 while
        # local ran 4 — and a presigned PUT that succeeded locally answered 400 in CI, which reads
        # as a product bug rather than an emulator difference.
        image: localstack/localstack:4
        env:
          SERVICES: s3
          DEBUG: '0'
        ports: ['4566:4566']
        options: >-
          --health-cmd "curl -sf http://localhost:4566/_localstack/health || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: quynhonsemiconductor/qnsc-ci/actions/setup-node-pnpm@v1
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # pull @qnsc-vn/* from GitHub Packages

      - name: Run migrations
        run: pnpm db:migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/opshub_test?sslmode=disable

      # `db:migrate` seeds only the prod-safe RBAC catalogue (permissions, roles, grants).
      # The e2e suite authenticates as the DEMO EMPLOYEES — one per system role, so a spec
      # can act as "the caller who holds nothing" and "the caller who holds it globally" —
      # and those come from `db:seed`. Without this step every e2e `beforeAll` fails at
      # dev-login with a 401 that looks nothing like the missing fixture it is.
      #
      # The e2e globalSetup truncates and re-seeds in-process as well, so for the e2e step
      # this is belt-and-braces. It stays because it fails LOUDLY and by name, where the
      # same failure inside a vitest globalSetup reads as a broken test file — and because
      # `E2E_SKIP_RESET=true` turns the in-process reseed off.
      - name: Seed demo fixtures for e2e
        run: pnpm db:seed
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/opshub_test?sslmode=disable

      - name: Generate ephemeral JWT keypair for tests
        # Generates a fresh EC P-256 keypair per CI run — never reuse a static secret.
        # Keys are exported as base64-encoded PEM to $GITHUB_ENV for use in test steps.
        run: |
          node - << 'EOF'
          const { generateKeyPairSync } = require('crypto');
          const fs = require('fs');
          const { privateKey, publicKey } = generateKeyPairSync('ec', {
            namedCurve: 'P-256',
            privateKeyEncoding: { type: 'pkcs8', format: 'pem' },
            publicKeyEncoding:  { type: 'spki',  format: 'pem' },
          });
          fs.appendFileSync(process.env.GITHUB_ENV, `CI_JWT_PRIVATE_KEY=${Buffer.from(privateKey).toString('base64')}\n`);
          fs.appendFileSync(process.env.GITHUB_ENV, `CI_JWT_PUBLIC_KEY=${Buffer.from(publicKey).toString('base64')}\n`);
          console.log('JWT keypair generated');
          EOF

      - name: Unit tests (with coverage)
        run: pnpm test:cov
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/opshub_test?sslmode=disable
          JWT_PRIVATE_KEY: ${{ env.CI_JWT_PRIVATE_KEY }}
          JWT_PUBLIC_KEY: ${{ env.CI_JWT_PUBLIC_KEY }}
          JWT_ACCESS_EXPIRY: 8h
          JWT_REFRESH_EXPIRY_DAYS: '7'
          JWT_ISSUER: opshub-api
          JWT_AUDIENCE: opshub-web
          CORS_ORIGINS: http://localhost:5173
          VALKEY_URL: redis://localhost:6379
          COOKIE_SECRET: ci-test-cookie-secret-min-32-characters-ok
          CSRF_SECRET: ci-test-csrf-secret-min-32-characters-okay
          LOG_LEVEL: fatal
          OTEL_ENABLED: 'false'
          OTEL_SERVICE_NAME: opshub-api-test

      # The coverage thresholds are a ratchet the config asks for in a comment — "raise these
      # as suites are added" — and a comment is not a gate. They had drifted 5-8 points behind
      # actual, far enough that a third of the suite could be deleted with `test:cov` still
      # green. This fails when any floor falls more than 3 points behind measured coverage, so
      # raising them stops being a thing to remember. Reads the json-summary report the step
      # above just wrote, so it never runs coverage twice.
      - name: Coverage floors track actual coverage
        run: pnpm check:coverage-floors

      # Prove the least-privilege grants from migration 0012 are COMPLETE, by running the
      # whole e2e suite as `opshub_app` instead of the owner.
      #
      # Without this the split is untested: every job above connects as `postgres`, which
      # owns everything, so a table or sequence the migration forgot to GRANT passes CI and
      # only fails after the real cutover — as a boot-time or first-write
      # `permission denied for …` on a code path with no obvious connection to a database
      # migration. The roles are created NOLOGIN, so CI grants LOGIN here; nothing else
      # changes.
      #
      # Same script the deployed cutover runs as a one-off migrator task, so what CI
      # exercises is the code path production uses. See
      # docs/runbooks/db-role-least-privilege.md.
      #
      # Only DATABASE_APP_PASSWORD is set: `opshub_worker` is skipped because nothing in
      # the e2e suite connects as it, and the script skips a role whose password is absent
      # rather than defaulting one.
      - name: Enable the least-privilege role for the e2e run
        run: pnpm db:roles:enable
        env:
          DATABASE_MIGRATION_URL: postgresql://postgres:postgres@localhost:5432/opshub_test?sslmode=disable
          # 24+ characters because the script refuses anything shorter — it is a credential
          # for a role with write access to every application table, even here.
          DATABASE_APP_PASSWORD: ci-opshub-app-least-privilege

      # The bucket has to exist before the app presigns into it: a presigned PUT against a missing
      # bucket succeeds at signing and fails at upload, which surfaces as a confirm-time
      # FILE_NOT_UPLOADED and reads like a product bug.
      - name: Create the S3 bucket in LocalStack
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4566/_localstack/health > /dev/null; then break; fi
            sleep 2
          done
          aws --endpoint-url http://localhost:4566 s3 mb s3://opshub-files-test
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1

      - name: E2E tests
        run: pnpm test:e2e
        env:
          S3_FILES_BUCKET: opshub-files-test
          STORAGE_ENDPOINT: http://localhost:4566
          STORAGE_FORCE_PATH_STYLE: 'true'
          STORAGE_ACCESS_KEY_ID: test
          STORAGE_SECRET_ACCESS_KEY: test
          AWS_REGION: us-east-1
          NODE_ENV: test
          # The APP connects as the restricted role, the MIGRATOR as the owner — the same
          # split the stack module gets at cutover. The e2e globalSetup truncates and
          # re-seeds, which needs the owner, so it reads DATABASE_MIGRATION_URL.
          DATABASE_URL: postgresql://opshub_app:ci-opshub-app-least-privilege@localhost:5432/opshub_test?sslmode=disable
          DATABASE_MIGRATION_URL: postgresql://postgres:postgres@localhost:5432/opshub_test?sslmode=disable
          JWT_PRIVATE_KEY: ${{ env.CI_JWT_PRIVATE_KEY }}
          JWT_PUBLIC_KEY: ${{ env.CI_JWT_PUBLIC_KEY }}
          JWT_ACCESS_EXPIRY: 8h
          JWT_REFRESH_EXPIRY_DAYS: '7'
          JWT_ISSUER: opshub-api
          JWT_AUDIENCE: opshub-web
          CORS_ORIGINS: http://localhost:5173
          VALKEY_URL: redis://localhost:6379
          COOKIE_SECRET: ci-test-cookie-secret-min-32-characters-ok
          CSRF_SECRET: ci-test-csrf-secret-min-32-characters-okay
          LOG_LEVEL: fatal
          OTEL_ENABLED: 'false'
          OTEL_SERVICE_NAME: opshub-api-test

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────
  # 3. Migration upgrade path — prove a migration applies to a REAL database,
  #    not just a fresh one.
  #
  #    A fresh-DB migrate cannot catch incremental-only hazards: the classic one
  #    is `ALTER TYPE … ADD VALUE` plus a use of that value in the same batch
  #    (Postgres 55P04), which passes on an empty database and fails on a
  #    deployed one. So build main's schema first, then apply only what this PR
  #    adds on top.
  # ─────────────────────────────────────────────────────────────────────────
  migrations:
    name: Migration upgrade path
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DATABASE_MIGRATION_URL: postgresql://postgres:postgres@localhost:5432/opshub_upgrade?sslmode=disable

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: opshub_upgrade
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # need origin/main to build the baseline schema
          persist-credentials: false

      # Expand-contract advisory (WARN-only): migrate-before-flip runs the new
      # migration while the OLD app is briefly still live, so backward-
      # incompatible DDL (drop/rename/narrow a column) can break it. Flag such DDL
      # in this PR's new migration lines via GHA annotations — never fails the
      # build. Acknowledge a deliberate one with a trailing
      # `-- expand-contract-ok: <reason>` on the line.
      - name: Expand-contract advisory
        if: github.event_name == 'pull_request'
        run: |
          added=$(git diff origin/main...HEAD -- 'db/migrations/*.sql' \
            | grep -E '^\+' | grep -vE '^\+\+\+' || true)
          if [ -z "$added" ]; then echo "No new migration lines."; exit 0; fi
          pattern='DROP[[:space:]]+COLUMN|DROP[[:space:]]+TABLE|RENAME[[:space:]]+(COLUMN|TO)|SET[[:space:]]+NOT[[:space:]]+NULL'
          hits=$(echo "$added" | grep -iE "$pattern" | grep -iv 'expand-contract-ok' || true)
          if [ -n "$hits" ]; then
            echo "$hits" | while IFS= read -r line; do
              echo "::warning title=Expand-contract::Backward-incompatible DDL — verify migrate-before-flip safe: ${line#+}"
            done
          else
            echo "No backward-incompatible DDL detected."
          fi

      - uses: quynhonsemiconductor/qnsc-ci/actions/setup-node-pnpm@v1
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      # Baseline: check out main's ENTIRE db/ tree (migrations, seed AND the
      # Drizzle schema) and run it end-to-end, so the DB mirrors a real deployed
      # environment as the last release produced it. Then restore this PR's files.
      # Pinning the whole tree — not just db/migrations — matters because
      # `db:migrate` also runs the seed, and the seed builds its INSERTs from the
      # Drizzle schema: a PR that adds a column would otherwise run HEAD's seed
      # against main's older tables and fail spuriously.
      # (On push-to-main this is a no-op: origin/main == HEAD.)
      - name: Apply baseline (main) migrations
        run: |
          git checkout origin/main -- db
          pnpm db:migrate
          git checkout HEAD -- db

      # Upgrade: apply only the migrations this PR adds, on the committed
      # baseline. Reproduces the committed-enum restriction and any other
      # incremental-only hazard; fails the PR if the upgrade cannot complete.
      - name: Apply new migrations on top of baseline
        run: pnpm db:migrate

  # ─────────────────────────────────────────────────────────────────────────
  # 4. Docker build validation (BuildKit cache, no push)
  #    Runs after tests to avoid wasting compute on broken code.
  # ─────────────────────────────────────────────────────────────────────────
  build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [quality, test]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4

      - name: Build api image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          target: api
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
          secrets: |
            node_auth_token=${{ secrets.GITHUB_TOKEN }}

      - name: Build migrator image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          target: migrator
          push: false
          cache-from: type=gha,scope=migrator
          cache-to: type=gha,mode=max,scope=migrator
          secrets: |
            node_auth_token=${{ secrets.GITHUB_TOKEN }}

      - name: Build worker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          target: worker
          push: false
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker
          secrets: |
            node_auth_token=${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────────────────────────────────
  # 4. OpenAPI spec — generate and check for breaking changes on PRs.
  #    Publishes the spec as an artifact so the FE repo can download it.
  # ─────────────────────────────────────────────────────────────────────────
  openapi:
    name: OpenAPI contract
    runs-on: ubuntu-latest
    needs: [quality]
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: opshub_openapi
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: quynhonsemiconductor/qnsc-ci/actions/setup-node-pnpm@v1
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # pull @qnsc-vn/* from GitHub Packages

      - name: Run migrations
        run: pnpm db:migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/opshub_openapi?sslmode=disable

      - name: Generate ephemeral JWT keypair
        run: |
          node - << 'EOF'
          const { generateKeyPairSync } = require('crypto');
          const fs = require('fs');
          const { privateKey, publicKey } = generateKeyPairSync('ec', {
            namedCurve: 'P-256',
            privateKeyEncoding: { type: 'pkcs8', format: 'pem' },
            publicKeyEncoding:  { type: 'spki',  format: 'pem' },
          });
          fs.appendFileSync(process.env.GITHUB_ENV, `CI_JWT_PRIVATE_KEY=${Buffer.from(privateKey).toString('base64')}\n`);
          fs.appendFileSync(process.env.GITHUB_ENV, `CI_JWT_PUBLIC_KEY=${Buffer.from(publicKey).toString('base64')}\n`);
          EOF

      - name: Build api
        run: pnpm build:api

      - name: Start API and capture OpenAPI spec
        run: |
          node dist/apps/api/apps/api/src/main.js &
          API_PID=$!
          echo "API_PID=$API_PID" >> "$GITHUB_ENV"
          # Poll until ready (max 30s)
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/v1/healthz > /dev/null 2>&1; then
              echo "API ready after ${i}s"
              break
            fi
            sleep 1
          done
          curl -sf http://localhost:3000/api/docs-json -o openapi.json
          kill "$API_PID" || true
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/opshub_openapi?sslmode=disable
          JWT_PRIVATE_KEY: ${{ env.CI_JWT_PRIVATE_KEY }}
          JWT_PUBLIC_KEY: ${{ env.CI_JWT_PUBLIC_KEY }}
          JWT_ACCESS_EXPIRY: 8h
          JWT_ISSUER: opshub-api
          JWT_AUDIENCE: opshub-web
          CORS_ORIGINS: http://localhost:5173
          VALKEY_URL: redis://localhost:6379
          COOKIE_SECRET: ci-test-cookie-secret-min-32-characters-ok
          CSRF_SECRET: ci-test-csrf-secret-min-32-characters-okay
          JWT_REFRESH_EXPIRY_DAYS: '7'
          LOG_LEVEL: fatal
          OTEL_ENABLED: 'false'
          OTEL_SERVICE_NAME: opshub-api

      # The SPA's API client is generated from this very spec and COMMITTED, so it can
      # silently fall behind a DTO change with nothing to notice. `tsc` does not: on an
      # incremental build it can pass against stale build info, and a route the client has
      # never heard of only fails at runtime as `Cannot POST /v1/...`. Regenerating here and
      # diffing is the cheapest proof that the two agree.
      #
      # Reads the spec file just captured, not a live server, so it is deterministic. Fix a
      # failure with `pnpm --filter opshub-web codegen` against a local API, then commit.
      #
      # Ported from rally, where the same gap cost real debugging time twice in one day.
      - name: Generated web client matches the spec
        run: pnpm --filter opshub-web codegen:check
        env:
          OPENAPI_SPEC: ${{ github.workspace }}/openapi.json

      - name: Upload OpenAPI spec artifact
        uses: quynhonsemiconductor/qnsc-ci/actions/publish-openapi-spec@v1
        with:
          spec-path: openapi.json
          artifact-name: openapi-spec-${{ github.sha }}
          retention-days: "30"

      # On PRs: download the base-branch spec and diff for breaking changes.
      - name: Download base spec
        if: github.event_name == 'pull_request'
        uses: dawidd6/action-download-artifact@b6e2e70617bc3265edd6dab6c906732b2f1ae151  # v21
        continue-on-error: true   # first PR has no base artifact yet
        with:
          workflow: backend-ci.yml
          branch: ${{ github.base_ref }}
          name: openapi-spec-${{ github.event.pull_request.base.sha }}
          path: base-spec/

      - name: Check for breaking API changes (PR only)
        if: github.event_name == 'pull_request'
        uses: quynhonsemiconductor/qnsc-ci/actions/validate-openapi-contract@v1
        with:
          current-spec-path: openapi.json
          base-spec-path: base-spec/openapi.json
          fail-on-breaking: "true"
