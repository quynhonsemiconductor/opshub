# =============================================================================
# CI — fast quality gates on every PR and push to main
# Gate: lint → typecheck → unit tests → e2e tests → docker build → openapi diff
# Security scans live in the Security · Scan workflow — independently runnable.
# =============================================================================
name: Backend · CI

on:
  merge_group:
  push:
    branches: [main]
  pull_request:
    # NO `branches:` filter here, deliberately — see `push` above, which keeps one.
    #
    # On `pull_request` this filter matches the PR's BASE branch, which is a different
    # question from `push`'s. Set to [main] it means "only run when this PR is aimed at
    # main", so a PR aimed anywhere else — a stacked PR, aimed at the branch below it —
    # got no CI at all, silently, while still reporting green. rova's eight-PR Phase 7
    # stack sat in exactly that state: seven of eight ran nothing but PR-title and labeler.
    #
    # `main` is this repo's only long-lived branch, so the filter skipped nothing anyone
    # wanted skipped. No upside, one silent failure mode.
    # NOT `edited`. That action exists only for the PR-title check, which now lives in
    # pr-title.yml — and listening for it here was actively harmful: combined with
    # `cancel-in-progress: true` below and the `if: action != 'edited'` guards this workflow
    # used to carry, editing a PR title or body CANCELLED the in-flight real run and replaced
    # it with one where every heavy job skipped. GitHub counts a skipped required check as
    # passing, so the PR went green having executed nothing. Every run of this workflow is now
    # a real one.
    types: [opened, synchronize, reopened]

concurrency:
  # A PUSH TO MAIN IS NEVER CANCELLED, and that takes a group of its own per commit. The group used to be
  # `ci-backend-${{ github.ref }}` with cancel-in-progress, so two commits landing on main close together shared
  # `ci-backend-refs/heads/main` and the second CANCELLED the first's run. The first commit's deploy then failed its
  # "wait for Backend · CI on this commit" gate: a green commit that could not deploy ("Canceling since a higher
  # priority waiting request for ci-backend-refs/heads/main exists").
  #
  # `cancel-in-progress: false` alone would NOT have fixed it: GitHub keeps ONE pending run per group and cancels
  # every other pending one, so a third push still killed the second's run. Only a distinct group per commit
  # keeps them all.
  #
  #   pull_request -> one group per PR, cancel in progress (a newer push to the PR supersedes the older run:
  #                   unchanged behaviour; refs/pull/N/merge was already per PR)
  #   push (main)  -> one group per COMMIT, never cancelled
  #   anything else (schedule, dispatch) -> its own run id, so it can neither cancel nor be cancelled by a push
  #
  # `pr-title.yml` deliberately has its own group and is unaffected.
  group: ci-backend-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || (github.event_name == 'push' && format('main-{0}', github.sha) || format('{0}-{1}', github.event_name, github.run_id)) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # No longer for the semantic-PR action — that moved to pr-title.yml, which declares its
  # own. Kept because it is read-only and removing a permission is a bigger claim than
  # this change is making: nothing here needs it today (the openapi job reads
  # `github.event.pull_request.base.sha` straight off the payload, which needs no grant).
  pull-requests: read
  packages: read       # pull @quynhonsemiconductor/* from GitHub Packages

env:
  # 24, matching .nvmrc and the Dockerfile's `ARG NODE_VERSION=24`. Nothing overrides that
  # ARG, so the shipped image runs 24 — while CI ran 22, meaning no suite ever executed on
  # the version production uses.
  #
  # The split was not arbitrary. Node 24's V8 coverage instrumentation counts functions
  # differently and dropped the measured figure to 9.74% against a 10% floor, so bumping
  # this used to turn Tests red. That is fixed: the floors were raised to just under actual
  # (21/21/17/14) and `pnpm check:coverage-floors` now enforces the ratchet the config only
  # described, so the numbers are pinned on whichever runtime measures them.
  #
  # Measured on 24 before bumping: statements 22.27 / branches 18.71 / functions 15.58 /
  # lines 22.35 — every one above its floor and within the 3-point drift tolerance.
  NODE_VERSION: '24'
  PNPM_VERSION: '10.33.2'

jobs:
  # Does this pull request change anything this workflow tests? A change that touches only files the matching DEPLOY workflow ignores
  # (its `paths-ignore`) cannot affect what this workflow builds, so the heavy jobs are skipped and one cheap gate reports instead.
  # A push to main ALWAYS runs everything (deploys wait for that run), and every doubt (API error, empty file list, any file not on
  # the list) runs everything too: see actions/changed-paths in the ci repo.
  changes:
    name: Which parts changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.paths.outputs.run }}
    steps:
      - id: paths
        uses: quynhonsemiconductor/ci/actions/changed-paths@dcdd8dc937aa9d199a4e75e0e187eb52ca520836 # v1.23.1
        with:
          ignore: |
            **/*.md
            docs/**
            .claude/**
            apps/web/**
