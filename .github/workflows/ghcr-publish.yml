# =============================================================================
# GHCR · Publish — on-prem image delivery trigger for opshub (ONPREM-PLAN §11.1).
#
# On every merge to main this builds each service image, PRE-PUSH scans it
# (CRITICAL fixable vulns + ANY secret), and pushes
# ghcr.io/quynhonsemiconductor/opshub-<service> with the immutable sha-<commit>
# tag. This is the only image build now (the ECS/ECR deploy was retired with the
# AWS exit, 2026-11-02); the reusable refuses any ref except refs/heads/main.
#
# The reusable's `digests` output (JSON, service → sha256) is what the gitops
# bump writes into the values files; the run's step summary records the digests.
#
# ── ONE IMAGE PER DOCKERFILE STAGE ────────────────────────────────────────────
# The reusable passes `build-target: <service>`, which the Dockerfile REQUIRES:
# the root Dockerfile has one stage per service (`api`, `worker`, `migrator`), and
# with no target Docker builds the LAST one — k8s-deploy.yml records the incident
# where every repository silently held three copies of the migrator. The web image
# is its own Dockerfile (apps/web/Dockerfile, target `web`) and its own call below.
# =============================================================================
name: GHCR · Publish

on:
  push:
    branches: [main]
    # Skip when a merge touches ONLY paths this product does not ship (docs). paths-ignore fires only
    # if EVERY changed file matches — a shared change still builds, so under-deploy is impossible.
    # apps/web is NOT ignored any more: the SPA is an image too (publish-web below). Keeping ONE
    # workflow means a web-only merge also rebuilds api/worker/migrator; accepted as the smallest
    # correct filter (a job-level changed-paths gate would add a second path decision to keep in sync).
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.claude/**'

  # Manual run of whatever main currently holds.
  workflow_dispatch:

concurrency:
  # One GHCR publish per product at a time (the reusable declares the same
  # group); a push racing a workflow_dispatch serialises instead of racing.
  group: ghcr-publish-backend-opshub
  cancel-in-progress: false

jobs:
  publish:
    # Ceiling for the reusable's inner grants: packages: write is the GHCR
    # push AND the Dockerfile's pull of private @quynhonsemiconductor/*.
    permissions:
      contents: read
      packages: write
    # SHA-pinned, NOT @v1 — ci's v1 tag moves on every merge, and a moving ref
    # would let a ci merge change this product's publish pipeline unseen.
    uses: quynhonsemiconductor/ci/.github/workflows/ghcr-publish.yml@2a85ef7bb3c793edbc9b424ba2abeaed8080aab6 # v1.24.3
    with:
      product: opshub
      services-json: '["api","worker","migrator"]'
      # The on-prem k3s host is amd64; native amd64 runner (a QEMU build of
      # this pnpm + Nest compile fails — see the reusable's build_runner note).
      platforms: linux/amd64
      build_runner: ubuntu-24.04

  # The SPA as an image (DELIVERY-DESIGN-2026-11 §3.1): the Vite bundle in a read-only Caddy. It is
  # a SECOND call to the same reusable rather than another entry in the matrix above, because the
  # reusable takes ONE `dockerfile` per call and the web has its own (apps/web/Dockerfile; the root
  # Dockerfile has one stage per Node service). Same workflow, same scan-before-push, same digest.
  #
  # Not wired into any gitops bump yet: values/opshub has no `web` image until D's chart lands, and a
  # value its chart does not know would be noise in every dev bump. It joins at the dev cutover.
  #
  # Permissions and registry token MATCH the `publish` job above exactly (contents: read, packages:
  # write). There is deliberately no `id-token: write` and no attestation input: the reusable
  # attests nothing for ANY service yet (design §3.6 is phase 4), so asking for more here would not
  # produce provenance — it would only widen this job beyond the API's.
  publish-web:
    permissions:
      contents: read
      packages: write
    uses: quynhonsemiconductor/ci/.github/workflows/ghcr-publish.yml@7e8f6136a017c7b1f57a2e9a288dae3cd008950f # v1.31.1
    with:
      product: opshub
      services-json: '["web"]'
      dockerfile: apps/web/Dockerfile
      platforms: linux/amd64
      build_runner: ubuntu-24.04
