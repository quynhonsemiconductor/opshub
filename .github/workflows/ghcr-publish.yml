# =============================================================================
# GHCR · Publish — on-prem image delivery trigger for opshub (ONPREM-PLAN §11.1).
#
# On every merge to main this builds each service image, PRE-PUSH scans it
# (CRITICAL fixable vulns + ANY secret), and pushes
# ghcr.io/quynhonsemiconductor/opshub-<service> with the immutable sha-<commit>
# tag. This is the only image build now (the ECS/ECR deploy was retired with the
# AWS exit, 2026-11-02); the reusable refuses any ref except refs/heads/main.
#
# The reusable's `digests` output (JSON, service → sha256) is what the gitops
# bump writes into the values files; the run's step summary records the digests.
#
# ── ONE IMAGE PER DOCKERFILE STAGE ────────────────────────────────────────────
# The reusable passes `build-target: <service>`, which the Dockerfile REQUIRES:
# the root Dockerfile has one stage per service (`api`, `worker`, `migrator`), and
# with no target Docker builds the LAST one — k8s-deploy.yml records the incident
# where every repository silently held three copies of the migrator. The web image
# is its own Dockerfile (apps/web/Dockerfile, target `web`) and its own call below.
# =============================================================================
name: GHCR · Publish

on:
  push:
    branches: [main]
    # Skip when a merge touches ONLY paths this product does not ship (docs). paths-ignore fires only
    # if EVERY changed file matches — a shared change still builds, so under-deploy is impossible.
    # apps/web is NOT ignored any more: the SPA is an image too (publish-web below). Keeping ONE
    # workflow means a web-only merge also rebuilds api/worker/migrator; accepted as the smallest
    # correct filter (a job-level changed-paths gate would add a second path decision to keep in sync).
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.claude/**'

  # Manual run of whatever main currently holds.
  workflow_dispatch:

concurrency:
  # One GHCR publish per product PER COMMIT. A product-wide group lets a newer
  # main push replace the queued run for the previous commit (GitHub keeps one
  # pending run per group, even with cancel-in-progress false), and that commit
  # would never be published.
  group: ghcr-publish-backend-opshub-${{ github.sha }}
  cancel-in-progress: false

jobs:
  publish:
    # Ceiling for the reusable's inner grants: packages: write is the GHCR
    # push AND the Dockerfile's pull of private @quynhonsemiconductor/*.
    # id-token and attestations: ci v1.31.x attests the pushed digest (build
    # provenance + SBOM) and a called workflow's permissions are CAPPED by this
    # job's, so without them the reusable's build job fails at startup.
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    # SHA-pinned, NOT @v1 — ci's v1 tag moves on every merge, and a moving ref
    # would let a ci merge change this product's publish pipeline unseen.
    uses: quynhonsemiconductor/ci/.github/workflows/ghcr-publish.yml@400b7e9868e9ba6d172d956a08041ba19b574689 # v1.33.1
    with:
      product: opshub
      services-json: '["api","worker","migrator"]'
      # The on-prem k3s host is amd64; native amd64 runner (a QEMU build of
      # this pnpm + Nest compile fails — see the reusable's build_runner note).
      platforms: linux/amd64
      build_runner: ubuntu-24.04

  # The SPA as an image (DELIVERY-DESIGN-2026-11 §3.1): the Vite bundle in a read-only Caddy. It is
  # a SECOND call to the same reusable rather than another entry in the matrix above, because the
  # reusable takes ONE `dockerfile` per call and the web has its own (apps/web/Dockerfile; the root
  # Dockerfile has one stage per Node service). Same workflow, same scan-before-push, same digest.
  #
  # Not wired into any gitops bump yet: values/opshub has no `web` image until D's chart lands, and a
  # value its chart does not know would be noise in every dev bump. It joins at the dev cutover.
  #
  # Permissions and registry token MATCH the `publish` job above exactly: the
  # reusable attests every digest it pushes as of ci v1.31.x, so both jobs
  # grant id-token: write and attestations: write.
  publish-web:
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: quynhonsemiconductor/ci/.github/workflows/ghcr-publish.yml@400b7e9868e9ba6d172d956a08041ba19b574689 # v1.33.1
    with:
      product: opshub
      services-json: '["web"]'
      dockerfile: apps/web/Dockerfile
      platforms: linux/amd64
      build_runner: ubuntu-24.04

  # opshub-dev follows main: ONE dev bump per product.
  #
  # Two reusable bump-dev calls (services + web) would both target the same
  # bump/opshub-dev-<tag> branch for the same commit; the action pushes it
  # without force, so the second would be rejected. One job that needs both
  # calls and merges their digest maps is the single-bump option.
  #
  # Only services present in gitops values/opshub are written: web is built and
  # published but gitops has no web image yet (D's chart). It joins the list
  # when the chart lands; extra digests in the map are harmless.
  bump-dev:
    needs: [publish, publish-web]
    if: ${{ github.ref == 'refs/heads/main' && needs.publish.result == 'success' && needs.publish-web.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: gitops-bump-opshub-dev
      cancel-in-progress: false
    steps:
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        with:
          app-id: ${{ vars.QNSC_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.QNSC_AUTOMATION_PRIVATE_KEY }}
          owner: quynhonsemiconductor
          repositories: gitops
          permission-contents: write
          permission-pull-requests: write
      # api/worker/migrator and web never share a key, so `*` merges them.
      - id: digests
        env:
          SERVICES_DIGESTS: ${{ needs.publish.outputs.digests }}
          WEB_DIGESTS: ${{ needs.publish-web.outputs.digests }}
        run: |
          set -euo pipefail
          merged=$(jq -c -n --argjson a "${SERVICES_DIGESTS:-{}}" --argjson b "${WEB_DIGESTS:-{}}" '$a * $b')
          echo "digests=$merged" >> "$GITHUB_OUTPUT"
      - uses: quynhonsemiconductor/ci/actions/bump-gitops-tag@400b7e9868e9ba6d172d956a08041ba19b574689  # v1.33.1
        with:
          product: opshub
          env: dev
          services: api worker migrator
          tag: ${{ needs.publish.outputs.tag }}
          digests: ${{ steps.digests.outputs.digests }}
          mode: pull-request
          auto-merge: 'true'
          gitops-token: ${{ steps.app.outputs.token }}
