# =============================================================================
# Backend · Deploy — thin caller of the shared reusable (ci).
#
# Trigger:
#   develop → push to main (auto)
#   (prod is GONE: the AWS opshub production stack was destroyed 2026-10-21 —
#   owner decision; the v*.*.* tag trigger was removed so no tag can deploy a
#   prod that no longer exists.)
#
# The reusable builds/attests on main, promotes the exact dev image on tag,
# migrates, then rolls the ECS services. All ECS_*/RDS/APP_URL config is read
# from env-scoped GitHub vars; this caller passes only what the reusable
# declares (AWS_ACCOUNT_ID is a non-sensitive OIDC identifier → a Variable).
# =============================================================================
name: Backend · Deploy

on:
  push:
    branches: [main]
    # Skip the develop build+deploy when a merge touches ONLY paths this service
    # doesn't ship: docs and the web app. paths-ignore fires only if EVERY changed
    # file matches — a shared change (libs, db, root lockfile) still deploys, so
    # under-deploy is impossible. Release tags always change package.json +
    # manifest (root, never ignored) → prod never skipped.
    #
    # `infra/**` is deliberately NOT ignored, though it once was. Terraform owns
    # the task definition's environment (VALKEY_URL, DATABASE_*, CORS_ORIGINS, …),
    # but the ecs-service module sets `ignore_changes = [task_definition]` so the
    # SERVICE is never moved onto the revision Terraform registers — this pipeline
    # owns that. With infra ignored here, an infra-only merge registered a new task
    # definition that nothing ever rolled onto, and the change silently did not
    # take effect. Rova hit exactly that: its develop ran against a DELETED cache
    # endpoint (`valkey: down` on /v1/readyz) after a cache migration, because the
    # apply succeeded, the new definition was correct, and no deploy ran.
    #
    # Rolling the service from infra-apply instead would be worse: Terraform's
    # newest revision carries a new IMAGE, so rolling there would ship app code
    # ahead of the migration step. `wait-for-infra` below sequences it instead.
    #
    # Cost: a Terraform-only merge now rebuilds an image it does not strictly need.
    # Minutes of CI in exchange for removing a class of silent drift.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.claude/**'
      - 'apps/web/**'
  # Manual re-run, matching rova. Needed because a deploy can fail for reasons that have
  # nothing to do with the commit — an expired token, a throttled ECS API, a registry
  # hiccup — and without it the only way to retry is an empty commit, which rewrites
  # history to work around an infrastructure problem.
  #
  # Safe on both refs, and the gates below are why: nothing here branches on the TRIGGER,
  # only on the ref. `wait-for-infra` keys off whether this sha touched infra/**;
  # `wait-for-ci` skips entirely on a tag and otherwise waits on the Backend · CI run for
  # this sha — which, for an already-merged commit, is complete, so the wait returns
  # at once. It fails CLOSED when no run exists, so dispatching a commit that never passed
  # CI blocks rather than deploys.
  workflow_dispatch:

concurrency:
  # Serialize by ENVIRONMENT. develop only now — the prod path is gone.
  group: deploy-backend-develop
  cancel-in-progress: false   # never cancel a running deploy

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Ordering gate — never roll the app ahead of its own infrastructure.
  #
  # Backend·Deploy and Infrastructure·Apply both fire on the same push, as
  # independent workflows. Nothing sequenced them, so a commit that changes BOTH
  # infra and app code races: the deploy runs the migrator against the OLD task
  # definition while the new one is still being applied — which is how a secret
  # or DATABASE_* rename fails with a confusing auth error rather than a clear one.
  #
  # Deterministic by design:
  #   - commit does NOT touch infra/** → no infra run exists, proceed at once
  #   - commit DOES touch infra/**     → wait for that run on THIS sha
  # Keyed on the commit sha, so it can never wait on an unrelated run.
  # ───────────────────────────────────────────────────────────────────────────
  wait-for-infra:
    name: Wait for infrastructure
    runs-on: ubuntu-latest
    # Generous: on a tag this waits for apply-prod, which sits behind the
    # `production` environment's required reviewer. Timing out here is safe — the
    # deploy is re-runnable — but it should not fire because an approver stepped away.
    timeout-minutes: 120
    # Least-privilege: read the commit and query sibling runs, nothing else.
    # Explicit so an org-level default change cannot silently break the gate.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Does this commit change infrastructure?
        id: touched
        run: |
          # infra/modules/** is included ahead of the stack extraction: once the
          # environments call a LOCAL path module, a module-only commit changes both
          # plans, and matching only infra/live/ would let the deploy race the apply.
          if git diff --name-only HEAD~1 HEAD | grep -qE '^infra/(live|modules)/'; then
            echo "infra=true" >> "$GITHUB_OUTPUT"
          else
            echo "infra=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for Infrastructure · Apply on this commit
        if: steps.touched.outputs.infra == 'true'
        # The retry-then-poll logic, and the rule that a rate limit is not a verdict on the
        # awaited run, live in the shared action — see `quynhonsemiconductor/ci`. This was
        # hand-written here, with `gh run watch --exit-status`, which reports a 403 the same
        # way it reports a failed run: rova lost both deploys on 2026-09-13 to exactly that.
        uses: quynhonsemiconductor/ci/actions/wait-for-run@de56bff40c5468623aa9e69d1ebe8e638e874bdf # v1.24.2
        with:
          workflow: infra-apply.yml
          label: Infrastructure · Apply
          # The run on THIS ref: a release commit is pushed twice (main, and the vX.Y.Z tag) and both start an
          # Infrastructure · Apply on the same sha. Without a branch the gate takes the newest of the two, which on
          # a tag run can be the develop apply instead of the tag's prod apply it exists to wait for. `ref_name` is
          # `main` for a push to main and the tag name for a tag push (a run's head branch is the tag name).
          branch: ${{ github.ref_name }}
          # Warn: infra changed but no apply run exists. See the block comment above.
          if-missing: warn
          missing-message: >-
            infra changed but no Infrastructure · Apply run was found for this commit.

  # ───────────────────────────────────────────────────────────────────────────
  # CI gate — a red main must not deploy.
  #
  #   - push to main → wait for Backend · CI on this sha; the shared `wait-for-run` action
  #     propagates its conclusion, so a failed CI blocks deploy.
  #   - tag push → wait for the DEVELOP deploy of this sha instead. See below.
  #
  # Fails CLOSED: if no CI run is found for the sha, block rather than ship blind.
  #
  # WHY THE TAG BRANCH WAITS ON THE DEVELOP DEPLOY, AND NO LONGER EXITS 0.
  # It used to `exit 0` with "Backend · CI gate not applicable", which is true on its own
  # terms — Backend · CI runs on main, not on tags, so there is no CI run to await. But it
  # left prod with no gate at all, and a prod deploy does not build: it PROMOTES the
  # sha-<sha> image the develop deploy pushed. So the tag run's real precondition is not
  # CI, it is "develop already built and deployed this sha" — exactly what the promote
  # action's own failure message states ("The commit must be merged to main and deployed to
  # develop before tagging a release").
  #
  # With no gate the two runs race. This is PORTED FROM ROVA, where prod lost that race
  # on v0.7.13 (2026-08-31): a release merge fires both runs on the same commit, the tag
  # run cleared this gate in 3 seconds while the main run sat here for 15m16s waiting on
  # Backend · CI, and prod then exhausted the promote step's poll budget waiting for an
  # image that did not exist yet — failing 21 seconds before this gate cleared on the main
  # run. Nothing half-deployed (promote runs before the deploy job, and it is idempotent),
  # but the release needed a manual re-run. opshub shares the reusable workflow, the
  # promote action and this gate verbatim, so it had the same defect and simply had not
  # cut a release slow enough to expose it.
  #
  # Waiting on the whole develop RUN, not just its build jobs, is deliberate: it is the
  # documented contract, it is ONE run's conclusion rather than per-job polling, and it means
  # prod can never ship an image develop itself failed to deploy.
  #
  # NOT-FOUND WARNS RATHER THAN BLOCKING, unlike the main branch below. A release tag
  # always produces a develop run (package.json and the manifest are never in
  # paths-ignore), so absence means something unusual — a hand-cut tag on a docs-only
  # commit, or a deleted run — and the promote step's ECR poll is still the backstop.
  # Blocking would turn this gate into a new way to make a release un-shippable. Same
  # warn-and-proceed shape as wait-for-infra above. A develop run that EXISTS and FAILED
  # does block, which is the diagnostic this adds: prod now says "develop deploy failed"
  # in seconds instead of "not found in ECR" in ~17 min.
  # ───────────────────────────────────────────────────────────────────────────
  wait-for-ci:
    name: Wait for Backend · CI
    runs-on: ubuntu-latest
    # 45, not 30: the tag branch now awaits the develop deploy, whose own slowest input is
    # a Docker build that a lockfile change forces to rebuild from scratch. Rova measured
    # 24m24s for that run on the release this fix comes from.
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - name: Wait for Backend · CI on this commit
        uses: quynhonsemiconductor/ci/actions/wait-for-run@de56bff40c5468623aa9e69d1ebe8e638e874bdf # v1.24.2
        with:
          workflow: backend-ci.yml
          # `main` and not the tag ref: Backend · CI only runs on main.
          branch: main
          label: Backend · CI
          # Fail closed: no CI run for this sha means shipping blind.
          if-missing: fail
          missing-message: >-
            No Backend · CI run was found for this commit.

  deploy:
    needs: [wait-for-infra, wait-for-ci]
    # Must match the UNION of every inner job's own permissions in the reusable
    # backend-deploy.yml, not just its top-level default (contents: read) --
    # GitHub validates a reusable call's whole permission chain at trigger
    # time, and a caller job that only grants the top-level default causes a
    # startup_failure before any job runs. id-token/attestations are for the
    # build and promote jobs' AWS OIDC + provenance attestation steps.
    permissions:
      contents: read
      id-token: write
      attestations: write
      packages: read # build-push-ecr pulls private @quynhonsemiconductor/* from GitHub Packages
    uses: quynhonsemiconductor/ci/.github/workflows/backend-deploy.yml@de56bff40c5468623aa9e69d1ebe8e638e874bdf # v1.24.2
    with:
      product: opshub
      has_worker: true
      has_migrator: true
      # ARM64 (Graviton) Fargate, ~20% cheaper per vCPU-hour and GB-hour for identical
      # sizing. These two move TOGETHER with `cpu_architecture = "ARM64"` in
      # infra/live/*/main.tf, in one commit: ci's own note on these inputs is that
      # setting only one produces "image Manifest does not contain descriptor matching
      # platform" at task start — after a clean apply and a build that reported success.
      #
      # One commit is safe because `wait-for-infra` above holds this deploy until the
      # Infrastructure · Apply for the same sha finishes, so the ARM64 task definition
      # exists before the deploy that builds arm64 images rolls onto it. And the
      # ecs-service module runs `deployment_circuit_breaker` with rollback enabled, so a
      # task that cannot start returns the service to its previous x86 revision by itself.
      #
      # NATIVE ARM RUNNER, not QEMU: emulating an arm64 pnpm + Nest compile on an x86
      # runner multiplies build minutes by enough to outweigh the Fargate saving, which is
      # the reusable workflow's own stated reason for having a separate runner input.
      #
      # MULTI-ARCH (2026-10-13): the on-prem k3s host is amd64, so the image is now built for BOTH architectures: linux/amd64 on
      # ubuntu-24.04 and linux/arm64 on ubuntu-24.04-arm, natively, merged into one manifest by the reusable's `merge` job.
      # ECS stays on Graviton (cpu_architecture = ARM64 above) and pulls the arm64 entry of the same tag; `build_runner` and
      # `image_platforms` are ignored while multi_arch is true. Drop this when the product has left ECS.
      multi_arch: true

      # ── Build cache: GHA, not the `registry` default ─────────────────────────
      # The registry backend writes a `:buildcache` tag to ECR with `mode=max` and PULLS it
      # back on every build. GitHub runners live outside AWS, so each pull is ECR internet
      # egress at ~$0.085/GB. Measured 2026-09-12: ECR spend is ~94% DataTransfer-Out
      # ($29.49 / 345 GB in August) against $1.74 of storage — the opposite of where anyone
      # would look first.
      #
      # opshub's `:buildcache` is 0.35 GiB per image, which build-push-ecr's note calls
      # "effectively free" — accurate per image, misleading in aggregate: three images here
      # plus three in rova at ~5 builds/day is roughly 167 GB/month, about $14.
      #
      # `gha` keeps the cache and removes the egress. The 10 GB per-repository cap that
      # forced qnsc-kb onto `none` is irrelevant at ~1 GiB total across three scopes. The
      # cost is a lower cache hit rate on feature branches (GHA scopes per branch, falling
      # back to the default branch), paid in build minutes, which are unmetered on public
      # repositories.
      cache_backend: gha
    # Least-privilege: pass only what the reusable declares (no `secrets: inherit`).
    secrets:
      AWS_ACCOUNT_ID:       ${{ vars.AWS_ACCOUNT_ID }}
      SLACK_DEPLOY_WEBHOOK: ${{ secrets.SLACK_DEPLOY_WEBHOOK }}

  # ───────────────────────────────────────────────────────────────────────────
  # Grafana deploy annotation — ported from rova.
  #
  # WHY THIS IS NOT COSMETIC. opshub's Grafana alert rules fire on symptoms that a
  # deploy is one of the likeliest causes of, and without a deploy marker on the
  # dashboard there is nothing on screen that distinguishes "the service regressed"
  # from "a task was replaced 40 seconds ago". rova's `http-p99-latency` page on
  # 2026-08-31 was exactly that: the slow request was a cold start after a task
  # replacement, and establishing it took reading workflow job timestamps by hand
  # because the latency panel carried no deploy markers to line the spike up against.
  #
  # `continue-on-error: true` on purpose, and it is the whole safety argument: an
  # annotation is an observability nicety, and a Grafana outage or a rotated token must
  # never turn a SUCCESSFUL deploy into a red pipeline. The failure mode of this step is
  # a missing marker, never a blocked release.
  #
  # `if: always() && needs.deploy.result == 'success'` rather than a bare success():
  # `always()` is what lets this job run at all when an earlier job in the graph was
  # skipped, and the explicit result check is what keeps it from annotating a deploy
  # that did not happen. A marker for a deploy that never shipped is worse than none —
  # it sends the next reader looking for a cause in the wrong place.
  #
  # GRAFANA_ALERTS_TOKEN is an ORGANISATION secret with ALL-repository visibility, so
  # opshub needs no repo-level secret for this. Verified rather than assumed.
  #
  # The env label follows the same tag-versus-branch rule the deploy itself uses, so the
  # annotation lands on the environment that was actually deployed.
  # ───────────────────────────────────────────────────────────────────────────
  annotate-deploy:
    needs: [deploy]
    if: always() && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Post deploy annotation to Grafana
        continue-on-error: true
        env:
          GRAFANA_ALERTS_TOKEN: ${{ secrets.GRAFANA_ALERTS_TOKEN }}
          DEPLOY_ENV: develop
        run: |
          curl -sf -X POST "https://qnsc.grafana.net/api/annotations" \
            -H "Authorization: Bearer ${GRAFANA_ALERTS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
                  --arg text "opshub deployed ${GITHUB_SHA:0:7} to ${DEPLOY_ENV}" \
                  --arg env "$DEPLOY_ENV" \
                  '{tags: ["deploy", "opshub", $env], text: $text}')"
