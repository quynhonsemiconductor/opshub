# =============================================================================
# Backend · Deploy — thin caller of the shared reusable (qnsc-ci).
#
# Triggers:
#   develop → push to main (auto)
#   prod    → push a semver tag v*.*.*  (gated by the "production" GitHub
#             Environment's required reviewer, enforced inside the reusable)
#
# The reusable builds/attests on main, promotes the exact dev image on tag,
# migrates, then rolls the ECS services. All ECS_*/RDS/APP_URL config is read
# from env-scoped GitHub vars; this caller passes only what the reusable
# declares (AWS_ACCOUNT_ID is a non-sensitive OIDC identifier → a Variable).
# =============================================================================
name: Backend · Deploy

on:
  push:
    branches: [main]
    # Skip the develop build+deploy when a merge touches ONLY paths this service
    # doesn't ship: docs and the web app. paths-ignore fires only if EVERY changed
    # file matches — a shared change (libs, db, root lockfile) still deploys, so
    # under-deploy is impossible. Release tags always change package.json +
    # manifest (root, never ignored) → prod never skipped.
    #
    # `infra/**` is deliberately NOT ignored, though it once was. Terraform owns
    # the task definition's environment (VALKEY_URL, DATABASE_*, CORS_ORIGINS, …),
    # but the ecs-service module sets `ignore_changes = [task_definition]` so the
    # SERVICE is never moved onto the revision Terraform registers — this pipeline
    # owns that. With infra ignored here, an infra-only merge registered a new task
    # definition that nothing ever rolled onto, and the change silently did not
    # take effect. Rally hit exactly that: its develop ran against a DELETED cache
    # endpoint (`valkey: down` on /v1/readyz) after a cache migration, because the
    # apply succeeded, the new definition was correct, and no deploy ran.
    #
    # Rolling the service from infra-apply instead would be worse: Terraform's
    # newest revision carries a new IMAGE, so rolling there would ship app code
    # ahead of the migration step. `wait-for-infra` below sequences it instead.
    #
    # Cost: a Terraform-only merge now rebuilds an image it does not strictly need.
    # Minutes of CI in exchange for removing a class of silent drift.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.claude/**'
      - 'apps/web/**'
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'   # semver only — no -rc suffix

  # Manual re-run, matching rally. Needed because a deploy can fail for reasons that have
  # nothing to do with the commit — an expired token, a throttled ECS API, a registry
  # hiccup — and without it the only way to retry is an empty commit, which rewrites
  # history to work around an infrastructure problem.
  #
  # Safe on both refs, and the gates below are why: nothing here branches on the TRIGGER,
  # only on the ref. `wait-for-infra` keys off whether this sha touched infra/**;
  # `wait-for-ci` skips entirely on a tag and otherwise waits on the Backend · CI run for
  # this sha — which, for an already-merged commit, is complete, so `gh run watch` returns
  # at once. It fails CLOSED when no run exists, so dispatching a commit that never passed
  # CI blocks rather than deploys.
  workflow_dispatch:

concurrency:
  # Serialize by ENVIRONMENT, not raw ref: all prod (tag) deploys share one
  # group so prod DB migrations never run concurrently; develop shares another.
  # prod and develop still run in parallel (different groups).
  group: deploy-backend-${{ startsWith(github.ref, 'refs/tags/') && 'prod' || 'develop' }}
  cancel-in-progress: false   # never cancel a running deploy

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Ordering gate — never roll the app ahead of its own infrastructure.
  #
  # Backend·Deploy and Infrastructure·Apply both fire on the same push, as
  # independent workflows. Nothing sequenced them, so a commit that changes BOTH
  # infra and app code races: the deploy runs the migrator against the OLD task
  # definition while the new one is still being applied — which is how a secret
  # or DATABASE_* rename fails with a confusing auth error rather than a clear one.
  #
  # Deterministic by design:
  #   - commit does NOT touch infra/** → no infra run exists, proceed at once
  #   - commit DOES touch infra/**     → wait for that run on THIS sha
  # Keyed on the commit sha, so it can never wait on an unrelated run.
  # ───────────────────────────────────────────────────────────────────────────
  wait-for-infra:
    name: Wait for infrastructure
    runs-on: ubuntu-latest
    # Generous: on a tag this waits for apply-prod, which sits behind the
    # `production` environment's required reviewer. Timing out here is safe — the
    # deploy is re-runnable — but it should not fire because an approver stepped away.
    timeout-minutes: 120
    # Least-privilege: read the commit and query sibling runs, nothing else.
    # Explicit so an org-level default change cannot silently break the gate.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Does this commit change infrastructure?
        id: touched
        run: |
          # Tags ALWAYS gate. infra-apply's apply-prod job is `if: ref_type ==
          # 'tag'`, so a tag is the ONLY thing that applies prod infra — and the
          # prod deploy fires on the same tag. Path filters are not applied to tag
          # pushes either, so infra-apply always runs for a tag regardless of what
          # the commit touched.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "infra=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # infra/modules/** is included ahead of the stack extraction: once the
          # environments call a LOCAL path module, a module-only commit changes both
          # plans, and matching only infra/live/ would let the deploy race the apply.
          if git diff --name-only HEAD~1 HEAD | grep -qE '^infra/(live|modules)/'; then
            echo "infra=true" >> "$GITHUB_OUTPUT"
          else
            echo "infra=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for Infrastructure · Apply on this commit
        if: steps.touched.outputs.infra == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The sibling run may not be registered the instant this job starts, so
          # allow a grace period before concluding there is none.
          #
          # `|| ID=""` is not cosmetic: these runners use `set -e`, and an
          # assignment takes its command substitution's exit status, so a
          # rate-limited `gh run list` would skip the retry loop entirely and turn
          # a recoverable blip into a failed gate.
          for _ in $(seq 1 12); do
            ID=$(gh run list --workflow=infra-apply.yml --commit "$GITHUB_SHA" \
                   --limit 1 --json databaseId --jq '.[0].databaseId // empty') || ID=""
            [ -n "$ID" ] && break
            sleep 10
          done

          if [ -z "${ID:-}" ]; then
            echo "::warning::infra changed but no Infrastructure · Apply run found for $GITHUB_SHA — proceeding."
            exit 0
          fi

          echo "Waiting on infra-apply run $ID …"
          gh run watch "$ID" --exit-status
          echo "Infrastructure applied; deploy may proceed."

  # ───────────────────────────────────────────────────────────────────────────
  # CI gate — a red main must not deploy.
  #
  #   - tag push → CI does not run on tags, and prod is gated by the "production"
  #     Environment reviewer inside the reusable → nothing to await, proceed.
  #   - push to main → wait for Backend · CI on this sha; `gh run watch
  #     --exit-status` propagates its conclusion, so a failed CI blocks deploy.
  #
  # Fails CLOSED: if no CI run is found for the sha, block rather than ship blind.
  # ───────────────────────────────────────────────────────────────────────────
  wait-for-ci:
    name: Wait for Backend · CI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - name: Wait for Backend · CI on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "Tag deploy — Backend · CI gate not applicable."; exit 0
          fi
          # This job does not check out the repo, so `gh` cannot infer it from a
          # local remote — pass it explicitly.
          for _ in $(seq 1 12); do
            ID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow backend-ci.yml \
                   --branch main --commit "$GITHUB_SHA" \
                   --limit 1 --json databaseId --jq '.[0].databaseId // empty') || ID=""
            [ -n "$ID" ] && break
            sleep 10
          done
          if [ -z "${ID:-}" ]; then
            echo "::error::No Backend · CI run found for $GITHUB_SHA — blocking deploy (fail closed)."
            exit 1
          fi
          echo "Waiting on Backend · CI run $ID …"
          gh run watch --repo "$GITHUB_REPOSITORY" "$ID" --exit-status
          echo "Backend · CI succeeded; deploy may proceed."

  deploy:
    needs: [wait-for-infra, wait-for-ci]
    # Must match the UNION of every inner job's own permissions in the reusable
    # backend-deploy.yml, not just its top-level default (contents: read) --
    # GitHub validates a reusable call's whole permission chain at trigger
    # time, and a caller job that only grants the top-level default causes a
    # startup_failure before any job runs. id-token/attestations are for the
    # build and promote jobs' AWS OIDC + provenance attestation steps.
    permissions:
      contents: read
      id-token: write
      attestations: write
      packages: read # build-push-ecr pulls private @qnsc-vn/* from GitHub Packages
    uses: QNSC-VN/qnsc-ci/.github/workflows/backend-deploy.yml@v1.13.1
    with:
      product: opshub
      has_worker: true
      has_migrator: true
    # Least-privilege: pass only what the reusable declares (no `secrets: inherit`).
    secrets:
      AWS_ACCOUNT_ID:       ${{ vars.AWS_ACCOUNT_ID }}
      SLACK_DEPLOY_WEBHOOK: ${{ secrets.SLACK_DEPLOY_WEBHOOK }}

  # ───────────────────────────────────────────────────────────────────────────
  # Grafana deploy annotation — ported from rally.
  #
  # WHY THIS IS NOT COSMETIC. opshub's Grafana alert rules fire on symptoms that a
  # deploy is one of the likeliest causes of, and without a deploy marker on the
  # dashboard there is nothing on screen that distinguishes "the service regressed"
  # from "a task was replaced 40 seconds ago". rally's `http-p99-latency` page on
  # 2026-08-31 was exactly that: the slow request was a cold start after a task
  # replacement, and establishing it took reading workflow job timestamps by hand
  # because the latency panel carried no deploy markers to line the spike up against.
  #
  # `continue-on-error: true` on purpose, and it is the whole safety argument: an
  # annotation is an observability nicety, and a Grafana outage or a rotated token must
  # never turn a SUCCESSFUL deploy into a red pipeline. The failure mode of this step is
  # a missing marker, never a blocked release.
  #
  # `if: always() && needs.deploy.result == 'success'` rather than a bare success():
  # `always()` is what lets this job run at all when an earlier job in the graph was
  # skipped, and the explicit result check is what keeps it from annotating a deploy
  # that did not happen. A marker for a deploy that never shipped is worse than none —
  # it sends the next reader looking for a cause in the wrong place.
  #
  # GRAFANA_ALERTS_TOKEN is an ORGANISATION secret with ALL-repository visibility, so
  # opshub needs no repo-level secret for this. Verified rather than assumed.
  #
  # The env label follows the same tag-versus-branch rule the deploy itself uses, so the
  # annotation lands on the environment that was actually deployed.
  # ───────────────────────────────────────────────────────────────────────────
  annotate-deploy:
    needs: [deploy]
    if: always() && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Post deploy annotation to Grafana
        continue-on-error: true
        env:
          GRAFANA_ALERTS_TOKEN: ${{ secrets.GRAFANA_ALERTS_TOKEN }}
          DEPLOY_ENV: ${{ github.ref_type == 'tag' && 'production' || 'develop' }}
        run: |
          curl -sf -X POST "https://qnsc.grafana.net/api/annotations" \
            -H "Authorization: Bearer ${GRAFANA_ALERTS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
                  --arg text "opshub deployed ${GITHUB_SHA:0:7} to ${DEPLOY_ENV}" \
                  --arg env "$DEPLOY_ENV" \
                  '{tags: ["deploy", "opshub", $env], text: $text}')"
