# =============================================================================
# Infrastructure · Plan — thin caller of the shared reusable (ci).
# Dry-run on every PR touching infra/live/**; posts a plan comment per changed
# workspace and gates on `tofu fmt`.
# =============================================================================
name: Infrastructure · Plan

on:
  pull_request:
    # NO `branches:` filter here, deliberately — see `push` above, which keeps one.
    #
    # On `pull_request` this filter matches the PR's BASE branch, which is a different
    # question from `push`'s. Set to [main] it means "only run when this PR is aimed at
    # main", so a PR aimed anywhere else — a stacked PR, aimed at the branch below it —
    # got no CI at all, silently, while still reporting green. rova's eight-PR Phase 7
    # stack sat in exactly that state: seven of eight ran nothing but PR-title and labeler.
    #
    # `main` is this repo's only long-lived branch, so the filter skipped nothing anyone
    # wanted skipped. No upside, one silent failure mode.
    paths:
      - "infra/live/**"
      # See infra-apply.yml: a local path module changes the plan for every
      # environment, so a module-only PR must be planned too.
      - "infra/modules/**"
      - ".github/workflows/infra-plan.yml"

# Granted at the caller so the reusable can request them (a reusable workflow
# can never exceed the caller's token). id-token:write is mandatory for the
# OIDC AssumeRole; without an explicit grant it defaults to `none` and GitHub
# rejects the whole workflow at compile time ("0 jobs" run failure).
permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  plan:
    uses: quynhonsemiconductor/ci/.github/workflows/infra-plan.yml@de56bff40c5468623aa9e69d1ebe8e638e874bdf # v1.24.2
    with:
      product: opshub
      tf_vars_json: |
        { "cloudflare_zone_id": "${{ vars.CLOUDFLARE_ZONE_ID }}" }
      # tf_vars_json carries ONE value: the Cloudflare zone id, which infra/live/_shared REQUIRES
      # (no default, 32-hex validation). CLOUDFLARE_ZONE_ID is an ORGANISATION variable, so it is
      # visible to this job; if it were ever unset the plan fails loudly instead of exporting an
      # empty id that the env stacks turn into "destroy the DNS records". The other stacks ignore it
      # (they declare no such variable and read the _shared output).
      #
      # The Entra tenant/client id and the Cloudflare account id are
      # PUBLIC identifiers and live in infra/live/*/variables.tf, so plan and apply
      # read the same value from git.
      #
      # Passing them from Actions variables made this job lie: ENTRA_CLIENT_ID is
      # environment-scoped and a plan job has no `environment:` context (adding one
      # would gate every PR behind the production reviewer), so it resolved to "" and
      # every plan reported the api and worker task definitions "must be replaced".
      # Reviewers who see phantom replacements on every PR stop reading plans.
      #
      # `acm_cert_arn` is gone too: it was a required variable that no resource in
      # either environment ever read — the HTTPS listener and its certificate belong to
      # the shared ALB in qnsc-infra/live/runtime-<env>.
      #
      # image_tag stays unpassed on purpose. It is only known at release time, so a
      # task-definition revision bump in a prod plan is expected.
    secrets:
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      # Read-only qnsc-repo-reader key: the reusable mints a contents:read token for tf-modules.
      # This workflow runs on pull requests, so it never receives a write-capable key.
      QNSC_REPO_READER_PRIVATE_KEY: ${{ secrets.QNSC_REPO_READER_PRIVATE_KEY }}
      # Secret TF_VARs (masked inside the reusable). Without cloudflare_api_token the
      # Cloudflare provider cannot refresh the API's DNS record and the plan errors.
      # Without grafana_alerting_auth the plan disagrees with apply about whether
      # module.alerts/grafana_slo/grafana_dashboard exist at all (see infra-apply.yml).
      tf_secret_vars_json: |
        {
          "cloudflare_api_token": "${{ secrets.CLOUDFLARE_API_TOKEN }}",
          "grafana_alerting_auth": "${{ secrets.GRAFANA_ALERTS_TOKEN }}"
        }
