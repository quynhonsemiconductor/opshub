# =============================================================================
# Release · Promote — a vX.Y.Z tag RETAGS the digests already published for that
# commit and opens the reviewed gitops prod PR. It builds NOTHING.
#
# The work lives in ci's reusable, pinned below to the merged commit that writes
# the SPA image to web.image (ci#305). The tag can be pushed while the
# same commit's GHCR · Publish run is still building, and release-retag looks for
# sha-<12> once, so wait for that run first and propagate its conclusion.
#
# `web` IS in `services`: gitops values/opshub now carries the top-level
# `web.image` (the chart's SPA component), and ghcr-publish's second call
# publishes the SPA image from the SAME release commit (build-once). The
# reusable and the bump action write it to `web.image.{tag,digest}`, not under
# `services.web`.
# =============================================================================
name: Release · Promote

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

concurrency:
  group: release-promote-opshub
  cancel-in-progress: false

jobs:
  wait-for-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read # wait-for-run reads the run list
    steps:
      - uses: quynhonsemiconductor/ci/actions/wait-for-run@400b7e9868e9ba6d172d956a08041ba19b574689  # v1.33.1
        with:
          workflow: ghcr-publish.yml
          sha: ${{ github.sha }}
          branch: main
          label: GHCR · Publish
          max-wait-minutes: '45'
          failure-message: "The GHCR · Publish run for this release commit did not succeed, so there is no sha-<12> image to retag. Fix the build, then re-run this release job."
          missing-message: "No GHCR · Publish run exists for this commit. Cut the release from a commit that was published to main."

  promote:
    needs: wait-for-publish
    # Ceiling for the reusable's jobs: retag pushes an image tag and verifies
    # attestations.
    permissions:
      contents: read
      packages: write
      attestations: read
    # Pins the merged ci commit that writes web to web.image (#305). The newest
    # release, v1.34.0, predates that fix and writes web to services.web, which the
    # values schema rejects; every older tag does the same. Re-pin to the release
    # that ships the fix once cut.
    uses: quynhonsemiconductor/ci/.github/workflows/release-promote.yml@355d3c2c5893cb3b60fc68977d19e87554ed8648  # merged main, ci#305
    with:
      product: opshub
      gitops-product: opshub
      release-tag: ${{ github.ref_name }}
      commit: ${{ github.sha }}
      services: api worker migrator web
    secrets:
      QNSC_AUTOMATION_PRIVATE_KEY: ${{ secrets.QNSC_AUTOMATION_PRIVATE_KEY }}
