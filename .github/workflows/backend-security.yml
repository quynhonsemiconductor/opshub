# =============================================================================
# Security · Scan — thin caller of the shared reusable suite (qnsc-ci).
#
# One org-wide security standard: Trivy (container CVEs, CRITICAL blocks),
# Semgrep (SAST — replaces CodeQL, no GHAS needed), Gitleaks (secrets) and
# osv-scanner (dependency CVEs — replaces dependency-review). Runs on every PR,
# every push to main, and weekly to catch newly disclosed CVEs between pushes.
#
# actions-security (zizmor) replaces Code Scanning Default Setup's
# `Analyze (actions)` as the GitHub Actions workflow security gate — Default
# Setup autobuild is unreliable on bot-authored PRs and on repos with a lone
# script in a language the repo isn't otherwise built in (see rally's
# tools/*.py false-red). Blocking — the initial rollout ran clean, no findings.
# =============================================================================
name: Security · Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1" # weekly Monday 04:00 UTC — catch new CVEs between pushes

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Ceiling for the reusable's SARIF-upload job, which declares security-events:write
  # itself -- a called workflow's job permissions can only be REDUCED, not elevated,
  # above this caller's top-level grant, and GitHub validates the whole chain at
  # startup -- so this must stay even though no step in THIS file uses it directly.
  security-events: write # zizmor: ignore[excessive-permissions] ceiling for reusable's SARIF job
  packages: read # ceiling for the reusable Trivy build to pull private @qnsc-vn/* (packages can only be reduced, not elevated, in the called workflow)

jobs:
  security:
    uses: QNSC-VN/qnsc-ci/.github/workflows/security.yml@v1.10.0
    with:
      product: opshub
      image_target: api
      # Semgrep runs report-only for now: findings are in shared infra/config
      # (workflow action tags, dependabot/pnpm/npm supply-chain hardening, pg-ssl
      # TLS, editor sanitisation) and are being addressed org-wide separately.
      # Keep osv (dependency CVEs) blocking. Mirrors the org
      # chore/defer-semgrep-blocking decision.
      osv_blocking: true
    # security.yml declares no secrets — nothing to pass (no `secrets: inherit`).

  actions-security:
    permissions:
      contents: read
      security-events: write
    uses: QNSC-VN/qnsc-ci/.github/workflows/actions-security.yml@v1
    with:
      blocking: true
