version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "ci(deps)"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels: ["dependencies"]
    commit-message:
      prefix: "deps"
    # ZERO = Dependabot opens no npm VERSION pull requests. Renovate owns them now.
    #
    # Both prerequisites that forced the earlier revert are now met:
    #   1. Renovate is out of Silent mode with Automated PRs on, set at the org
    #      level so every repository inherits it.
    #   2. Renovate can READ the first-party packages. Its dashboard reported
    #      "no-result" for all five @quynhonsemiconductor/* packages until a host
    #      rule bound npm.pkg.github.com to a read:packages token belonging to the
    #      qnsc-bot machine account. The Dependency Lookup Warnings panel is now
    #      clear. Note the binding lives in the Mend UI, NOT in
    #      .github/renovate-config.json — config-based secret templating did not
    #      resolve on the hosted app.
    #
    # SECURITY updates are unaffected and keep flowing: they come from the advisory
    # database and ignore this file entirely. That is why the ecosystem block stays
    # rather than being deleted — deleting it looks equivalent and is not.
    #
    # github-actions, terraform and pip stay with Dependabot until Renovate's own
    # dashboard shows it detecting them here. Evidence, not assumption.
    open-pull-requests-limit: 0
    groups:
      # MINOR AND PATCH ONLY, and the exclusion is the point of the grouping.
      #
      # Without `update-types`, a group sweeps majors in alongside everything else and
      # presents a framework upgrade as a routine bump. That is not hypothetical here:
      # one such PR carried NestJS 11 -> 12 across nine packages plus ioredis 5 -> 6,
      # in a +1300/-1600 diff titled "bump the production-dependencies group with 45
      # updates". Its sibling carried TypeScript 6 -> 7 and vitest 4 -> 5, and failed
      # lint outright. Both were closed rather than reviewed, because a 45-package diff
      # containing a framework major cannot be attributed when something breaks.
      #
      # Majors still get PRs — they simply open individually, one dependency each,
      # reviewable on their own merits.
      production-dependencies:
        dependency-type: "production"
        update-types: ["minor", "patch"]
      development-dependencies:
        dependency-type: "development"
        update-types: ["minor", "patch"]

  # Shared Terraform modules from tf-modules, pinned by git tag as
  # `?ref=<module>-vX.Y.Z`. WITHOUT THIS ECOSYSTEM every module bump is manual, and that
  # is exactly how the drift happened: ecs-cluster sat at v1.0.0 in both products while
  # v2.0.0 was released, and qnsc-infra-template — the repo new products are created from
  # — rotted to ecr v1.1.0, ecs-service v1.3.0 and secrets v1.1.0.
  #
  # `directories` with a GLOB, not a fixed list. A new environment directory is picked up
  # without editing this file — a hand-maintained list of places to look is the same
  # defect the pin-drift report had when it named its consumer repos by hand.
  #
  # chore(deps), not infra(deps): the PR-title check only accepts the conventional-commit
  # types, and a rejected title blocks the very PR this exists to open.
  - package-ecosystem: "terraform"
    directories: ["/infra/live/*", "/infra/modules/*"]
    schedule:
      interval: "weekly"
      day: "monday"
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(deps)"
    # PROVIDERS IGNORED, MODULES UPDATED — and the first half is not optional.
    #
    # Dependabot's terraform updater treats providers and modules as one dependency set.
    # Across several directories it tried to rewrite a `required_providers` block in a
    # file that has none and threw, failing the whole job:
    #
    #   ERROR Error processing hashicorp/aws (RuntimeError)
    #   ERROR Content didn't change!
    #         terraform/lib/dependabot/terraform/file_updater.rb:34
    #
    # So no module updates were produced either — the run failed before opening anything.
    #
    # Ignoring providers is also the right POLICY, not merely a workaround. The `~>`
    # constraints on aws and cloudflare are deliberate, and an automatic major bump of the
    # AWS provider against live state is not something to receive on a Monday morning.
    #
    # `ignore` rather than an `allow` allowlist for the modules: if a new provider is added
    # later, this fails loudly again and gets a decision. An allowlist whose pattern stopped
    # matching would produce NO updates and no error, which is the silent failure this whole
    # effort exists to remove.
    ignore:
      - dependency-name: "hashicorp/*"
      - dependency-name: "cloudflare/*"
