# osv-scanner suppressions. Read by the shared security workflow from the directory of the
# lockfile it scans. EVERY entry expires: ignoreUntil is at most 30 days out, so an ignore
# cannot quietly become permanent -- when it lapses the check goes red again and somebody
# has to look.

[[IgnoredVulns]]
id = "GHSA-ch52-4w7c-c8xp"
ignoreUntil = 2026-11-08
reason = """\
http-cache-semantics <= 4.2.0 (CVE-2026-93748, max-stale can re-serve a shared-cache entry \
that carried Set-Cookie). NO patched version exists: the GitHub advisory lists \
first_patched_version = null and OSV records last_affected 4.2.0. 4.3.0 is newer but does \
not touch max-stale handling (it changes Vary), and the maintainer disputes the report as \
RFC 9111-conformant (kornelski/http-cache-semantics#56), so bumping to it would only hide \
the finding. Reached only through @swc/cli -> @xhmikosr/bin-wrapper -> downloader -> got -> \
cacheable-request, a devDependency that downloads the swc binary; nothing here runs a shared \
HTTP cache that serves other users. Revisit by the expiry: drop this entry if a fixed release \
ships or the advisory is withdrawn."""

[[IgnoredVulns]]
id = "GHSA-xcx6-jx8p-x3h5"
ignoreUntil = 2026-11-21
reason = """\
@azure/msal-node 5.2.5 (auth-code flow may disclose parameters to an attacker-controlled endpoint, CVSS 7.5, fixed 7.1.0). The fix is TWO majors above what the only consumer holds: @azure/identity 4.14 declares msal-node ^6.0.0, and no 5.x of @azure/identity exists yet, so an override would run msal-node 7 against an adapter built and tested for 6. opshub reaches msal ONLY through @azure/identity's CLIENT-CREDENTIALS path (Graph token acquisition); the vulnerable AUTHORIZATION-CODE flow is browser SSO and is not exercised anywhere in this service. Revisit by the expiry: when @azure/identity ships a 5.x line depending on msal-node >=7.1.0, bump it here; if that has not happened by the expiry, re-verify the flow claim and renew with fresh evidence."""
