# Local development only: a single Garage node for OpsHub's files bucket and the e2e suite's bucket. It replaces LocalStack,
# whose community edition does not keep data across a restart. The secrets below are fixed and public on purpose, for a laptop.
# Production uses object storage in AWS and never reads this file.
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"
replication_factor = 1
rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"
rpc_secret = "1111111111111111111111111111111111111111111111111111111111111111"

[s3_api]
# The region must match the one the client signs with. OpsHub's StorageService signs with "auto" whenever STORAGE_ENDPOINT is
# set (the Cloudflare R2 region), so the local node uses the same one and the client needs no local branch.
s3_region = "auto"
api_bind_addr = "[::]:3900"
root_domain = ".s3.garage.localhost"

[admin]
api_bind_addr = "[::]:3903"
admin_token = "local-dev-garage-admin-token-not-a-secret"
