packages:
  - "apps/web"
allowBuilds:
  '@scarf/scarf': true
  '@swc/core': true
  # wrangler (installed by wrangler-action during the Pages deploy) pulls miniflare's
  # sharp and its own workerd; pnpm 11 fails the install while their build scripts are
  # unrecorded. sharp downloads prebuilt libvips, workerd the workers-runtime binary.
  sharp: true
  cpu-features: true
  esbuild: true
  protobufjs: true
  ssh2: true
  workerd: true

# Overrides live HERE, not in package.json's "pnpm.overrides": pnpm 11 no longer
# reads that field and ignores it silently, so an advisory pinned there is not
# pinned at all. Mirrors rova.
overrides:
  # Kept from before: esbuild's dev-server request vulnerability.
  "esbuild@<0.25.0": ">=0.25.0"
  # GHSA-xcx6-jx8p-x3h5 — msal-node <7.1.0 (auth-code flow parameter disclosure, CVSS 7.5).
  # SCOPED to @azure/identity: identity 4.13.1 declares msal ^5.1.0, so this is a two-major
  # jump FORCED under identity 4.13.1 — outside what identity declares, and no identity
  # release declaring msal >=7.1.0 exists yet (4.14 declares ^6). Accepted because msal's
  # 6.0.0 and 7.0.0 breaking changes are BOTH on the acquireTokenInteractive /
  # browser-loopback path (responseMode/form_post/ILoopbackClient), which nothing here uses:
  # opshub drives only ClientCertificateCredential and WorkloadIdentityCredential
  # (libs/modules/graph/src/graph-credential.ts), whose client-credentials surface is
  # unchanged across 5->6->7 (msal changelog 6.0.0/7.0.0). Full suite green on msal 7.1.0.
  # When @azure/identity ships a release declaring msal >=7.1.0, DROP this override.
  "@azure/identity>@azure/msal-node": "7.1.0"
  # GHSA-85x2-q946-cp5h / GHSA-8c8m-p3m8-cjg8 / GHSA-m943-m63m-w62w — nodemailer 10.1.2
  # (shared-token/IMAP URL handling, CVSS 6.5), fixed 10.1.4 on the 10.x line. In-major: the
  # only consumer is platform-mail's smtp transport, which declares >=6.9.
  "nodemailer": "10.1.4"
  # GHSA-333x-w4r6-6crp + three companions — fast-uri 4.1.5 (protocol confusion / percent
  # encoding, up to CVSS 6.1), fixed 4.2.3 on the 4.x line. In-major: reached via fastify's
  # @fastify/ajv-compiler, which declares the 4.x range itself.
  # GHSA-xjj6-f33q-929c + two companions — undici 8.10.2 (redirect cross-origin data leak,
  # CVSS 7.5), fixed 8.12.2 on the 8.x line. Same per-major span rule as the undici pins in
  # rova's file: each consumer stays inside the major it declares.
  # GHSA-rgw5-rvv9-x895 — brace-expansion, vulnerable <5.0.9, fixed 5.0.9. It
  # explicitly BYPASSES the CVE-2026-14257 mitigation, which is what the previous pin
  # here (5.0.8, GHSA-mh99-v99m-4gvg) was for — so 5.0.8 is no longer merely an older
  # floor, it is no longer a safe one. The range spans every published major, so the
  # whole tree has to move (leaf util).
  # Bumped 5.0.9 -> 5.0.12 for GHSA-6j4f-fj2g-mc7p (fixed 5.0.10), GHSA-qhr7-859c-m2p7
  # (fixed 5.0.11) and GHSA-q2hr-2g5m-vwhr (fixed 5.0.12). Same exact-pin shape.
  "brace-expansion": "5.0.12"
  # js-yaml. Two live majors, each patched separately: transitive via cosmiconfig
  # (@nestjs/cli, commitlint) and @nestjs/swagger.
  #   GHSA-pm4m-ph32-ghv5 — the original pin, fixed 4.3.0 / 5.2.2.
  #   GHSA-5p4m-2wfm-xmqj (CVE-2026-59870) — quadratic CPU in !!omap resolution,
  #     CVSS 7.5, fixed 4.3.1. NOT backported to 3.x. 5.x is unaffected, so only the
  #     4.x floor moves.
  #   GHSA-2883-xcg3-v3hh — CVSS 7.5, fixed 4.3.2. `maxTotalMergeKeys` counts only the
  #     keys a merge actually CONTRIBUTES, so an alias chain of EMPTY merge sources
  #     burns CPU without ever incrementing the counter the limit reads: the mitigation
  #     added for the advisory above is what this one walks past. 5.x unaffected again.
  # The floor is ^4.3.2, not ">=4.3.2": the looser form crosses into 5.x, and
  # @nestjs/swagger 11.4.5 and cosmiconfig were built against the 4.x API.
  "js-yaml@4": "^4.3.2"
  "js-yaml@5": "^5.2.2"
  # GHSA-c96f-x56v-gq3h — HIGH "DDoS with HTTP2", fixed 9.7.0. Transitive via
  # fastify / @nestjs/platform-fastify, whose declared ^9.6.0 already allows it.
  "find-my-way@<9.7.0": "9.7.0"
  # GHSA-2v37-7h3g-55p8 — nanoid, CVSS 8.2 HIGH: a custom generator loops forever when
  # `size` is 0. Fixed 3.3.18, and 5.1.6 on the 4.x/5.x line, which is not in this tree.
  # Transitive via postcss, whose declared range already allows the patch. Pinned "^3.3.18"
  # rather than ">=3.3.18": the loose form crosses into 6.x, which is ESM-only.
  #
  # THE FIRST PIN NAMED THE WRONG VERSION — "^3.3.17", for an advisory whose fix landed in
  # 3.3.18. A caret floor one patch BELOW the fix admits the fixed version without requiring
  # it, so the lockfile stayed on 3.3.17 and the scanner went on reporting the same advisory.
  # An override is only as good as the number in it: read the `fixed` event, not the version
  # that happened to be latest when the advisory was triaged.
  "nanoid@3": "^3.3.18"
  # fast-uri, FOUR advisories deep in the same parser: GHSA-4c8g-83qw-93j6 /
  # GHSA-v2hh-gcrm-f6hx (IDN canonicalization), then one that resolved to exactly 3.1.4,
  # then GHSA-7p8r-x3mc-p8w7 (CVSS 7.5, host confusion via a backslash authority
  # introducer), fixed per major at 2.4.4 / 3.1.5 / 4.1.2.
  #
  # A BARE key, like brace-expansion above, and that is the point. A ranged key
  # (`fast-uri@<3.1.5`) matches the range a dependency REQUESTS, not the version it
  # resolves to — so `>=3.1.5` cheerfully admitted 4.1.1, pinned and vulnerable at the
  # same time. Adding a second ranged key for the 4.x line did not help either:
  # @fastify/ajv-compiler kept 4.1.1 while the rest of the tree moved to 4.1.2.
  #
  # This is the path that reaches PRODUCTION — fastify -> @fastify/ajv-compiler ->
  # fast-uri — so a partially-applied pin is the worst outcome: the scanner is quiet on
  # nine of ten paths and the tenth is the one serving traffic. The whole tree is already
  # on 4.x, so a bare floor forces no major jump on anyone.
  # Bumped from >=4.1.2: newer advisories (GHSA-5jgf-p345-68v8 / GHSA-f65p-4m7j-42xc /
  # GHSA-fph4-wmhf-6fwf / GHSA-jqff-g426-hqxp — host confusion via skipped IDN
  # canonicalization, CVSS 7.5) are only fixed at 4.1.3 on the 4.x line. Bare key so it
  # binds the resolved version, matching the reasoning above.
  # Bumped from >=4.1.3: GHSA-hrr3-gc8f-f4qj and GHSA-jvvf-x445-j334 are fixed at 4.1.5 on
  # the 4.x line. Capped below 5.0.0 so the floor can never drag the tree onto a new major.
  "fast-uri": ">=4.2.3 <5.0.0"  # RAISED 4.1.5 for GHSA-333x/74x6/wjr9/xhq7 (percent-encoding, up to CVSS 6.1), fixed 4.2.3
  # GHSA-73wf-gq98-2v4g / GHSA-c83g-rgw3-j3cx — browserslist crash / prototype write via
  # untrusted browserslist-stats, CVSS 7.5, fixed 4.28.7. Transitive via the web build
  # toolchain; the tree is on 4.x so a floor forces no major jump.
  "browserslist@<4.28.7": ">=4.28.7"
  # GHSA-3m5p-2c4r-xxw2 / GHSA-w2qp-rph6-63g4 — fastify X-Forwarded-* spoofing under
  # trustProxy hop-count, fixed 5.12.1. Scope to the 5.x line the API runs; the 11.x in
  # the tree is a different (@fastify/*) package's versioning, untouched.
  # Bumped to 5.12.5 for GHSA-4mh8-r7rc-xpvc (fixed 5.12.5). This key also rewrites the
  # root's exact "fastify" pin, so the floor here — not package.json — is what decides the
  # resolved version: the lockfile sat on 5.12.3 while package.json said 5.12.4.
  "fastify@5": ">=5.12.7 <6.0.0"
  # GHSA-4mjr-xmp4-gh2g / GHSA-x5fp-wj9c-mxmx — qs DoS via attacker-controlled isBuffer,
  # fixed 6.16.0. Scope to the 6.x line (the 3.x `qs` in the tree is an unrelated package).
  "qs@6": ">=6.16.0"
  # GHSA-r28c-9q8g-f849 — postcss line-return parsing, fixed 8.5.18. Transitive
  # via the web build toolchain (vite / tailwind).
  "postcss@<8.5.18": ">=8.5.18"
  # Five advisories against undici, worst GHSA-4cwx-7wf7-3272 (CVSS 7.4). Dev-only here —
  # the reach is jsdom/vitest and testcontainers, not the running API — but an
  # osv-scanner rejection blocks every unrelated PR, which is its own kind of outage.
  #
  # TWO ranges, one per major, and they must stay that way. jsdom declares
  # `undici@^7.25.0` and reaches into the internal `undici/lib/handler/wrap-handler.js`,
  # which 8.x DELETED — so a single `<8.9.0: >=8.9.0` floor drags jsdom onto 8.9.0 and
  # every jsdom-environment suite dies at worker startup with MODULE_NOT_FOUND before a
  # single test runs. Backend suites (node environment) are unaffected, which is exactly
  # how that passes locally and fails in CI on the web tests. rova#380 paid for this
  # lesson; opshub copies the shape, not the debugging.
  #
  # Keep each consumer inside the major it declares:
  #   7.x — jsdom → vitest     (patched in 7.29.0)
  #   8.x — testcontainers     (patched in 8.9.0)
  #
  # Re-keyed per major and floors raised for eleven more advisories, fixed at 7.29.1 /
  # 8.10.2: GHSA-2gqq-gqf2-x968, GHSA-2jfj-6hjv-fm6j, GHSA-3wwx-pv8p-q78v,
  # GHSA-3xpg-4rpp-hhhm, GHSA-8436-99hf-9mmv, GHSA-pmjh-fq2x-6v4x, GHSA-r53p-7pc4-xj5r,
  # GHSA-rfgv-xxqx-mfg5, GHSA-rx4f-c7p8-82vq, GHSA-vp8m-p9jh-q5pm, GHSA-w293-vg96-wgc3.
  # The old ranged keys (`undici@>=8.0.0 <8.9.0`) matched the range a consumer REQUESTS,
  # so jsdom 30's `^8.x` request slipped past them and stayed on 8.10.0. `undici@7` /
  # `undici@8` match any request inside that major, and each target is capped below the
  # next one, so the jsdom constraint above still holds.
  "undici@7": ">=7.29.1 <8.0.0"
  "undici@8": ">=8.12.2 <9.0.0"  # RAISED 8.10.2 for GHSA-xjj6-f33q-929c + two (redirect cross-origin leak, CVSS 7.5), fixed 8.12.2
  # GHSA-f596-whhp-79r4 / GHSA-m9gg-hp2v-232j — @grpc/grpc-js, fixed 1.14.5 (1.13.6 on
  # the older line). Transitive via the OTel gRPC exporters, @nestjs/terminus and
  # dockerode; all request 1.x, so a floor capped below 2.0.0 forces no major jump.
  "@grpc/grpc-js": ">=1.14.5 <2.0.0"
  # GHSA-hrh2-vp3x-79xf — @xhmikosr/decompress, fixed 11.1.4. Dev-only: @swc/cli ->
  # bin-wrapper -> downloader, which fetches the swc binary at install time.
  "@xhmikosr/decompress": ">=11.1.4 <12.0.0"
  # GHSA-jggr-w7fw-pc2j — fast-copy, fixed 4.1.0 on the 4.x line. Dev-only via pino-pretty.
  "fast-copy": ">=4.1.0 <5.0.0"
  # GHSA-67c8-pqhq-4rmx — piscina, fixed 4.9.4 on the 4.x line. Dev-only via @swc/cli
  # (and @nestjs/cli through it), which pins ^4.
  "piscina": ">=4.9.4 <5.0.0"
  # GHSA-p6vx-979v-rg4c (fixed 1.6.2) / GHSA-jp82-f5mq-hwhp (fixed 1.6.3) — seroval.
  # Transitive via @tanstack/router-core in apps/web; it requests 1.x.
  "seroval": ">=1.6.3 <2.0.0"
  # GHSA-68fv-2mgg-jv7q — source-map-js, fixed 1.2.2. Transitive via postcss, tailwind,
  # css-tree (jsdom) and magicast (coverage); all request 1.x.
  "source-map-js": ">=1.2.2 <2.0.0"

  # Keep Better Auth's optional peers out of the production tree, declaratively (replaces
  # .pnpmfile.cjs, whose pnpmfileChecksum broke every Renovate lockfile regen; see "Keeping Better
  # Auth's optional peers out of the runtime image" in identity's README). better-auth declares 18
  # OPTIONAL peers (its CLI `drizzle-kit`, its test helpers `vitest`, its React/Solid clients, the
  # databases it can run on ...); pnpm resolves an optional peer against whatever the importing
  # project has installed, and `pnpm install --prod` follows the resulting optionalDependencies —
  # the runtime image gains vitest, vite and esbuild (how a Trivy CRITICAL on esbuild once reached
  # this image). Drop every optional peer — all 16, not only the ones installed today. drizzle-orm
  # and pg stay: identity uses them. scripts/check-better-auth-overrides.mjs compares this list
  # against better-auth's installed peerDependenciesMeta and fails on any Better Auth peer change.
  # pnpm 11 honours these; pnpm 10.33.2 keeps the peers out of the --prod tree too, though it still
  # records the peer declarations in the lockfile manifest copy (checked 2026-10-26).
  "better-auth>@lynx-js/react": "-"
  "better-auth>@prisma/client": "-"
  "better-auth>@sveltejs/kit": "-"
  "better-auth>@tanstack/react-start": "-"
  "better-auth>@tanstack/solid-start": "-"
  "better-auth>drizzle-kit": "-"
  "better-auth>mongodb": "-"
  "better-auth>mysql2": "-"
  "better-auth>next": "-"
  "better-auth>prisma": "-"
  "better-auth>react": "-"
  "better-auth>react-dom": "-"
  "better-auth>solid-js": "-"
  "better-auth>svelte": "-"
  "better-auth>vitest": "-"
  "better-auth>vue": "-"

# pnpm's `minimumReleaseAge` is a cooldown against a hijacked THIRD-PARTY release: a malicious version is usually
# caught and yanked within hours, so not installing anything younger than a day removes most of that exposure.
#
# SET EXPLICITLY (1440 minutes = 24 h). pnpm 11 already defaults to 24 h; we pin the value anyway
# so the cooldown survives a future default change, and to document intent next to the exemption
# below. (Under pnpm 10, which this repo used before the upgrade, there was no default at all and
# third-party packages got no cooldown.)
#
# Our own `@quynhonsemiconductor/*` packages are published by this organisation, from app-platform, by a pipeline we
# control, so the cooldown protects nothing there and costs a day on every release: platform-http 4.3.0 blocked rova's
# CI for ~22 hours on `ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION`. They are exempt, as a scope pattern (verified on 11.28.6:
# a <24 h `@quynhonsemiconductor/*` version is refused without the exclusion and resolves with it).
#
# This does NOT exempt a third-party package that a first-party one depends on, and it does not touch Renovate: the
# org preset (`quynhonsemiconductor/.github:renovate-config`) sets no `minimumReleaseAge`, so Renovate proposes our
# packages as soon as they are published. If the org ever adds one, give the `^@quynhonsemiconductor/` rule in that
# preset `"minimumReleaseAge": null`.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@quynhonsemiconductor/*'
patchedDependencies:
  # nestjs-zod 5.5.0 calls zod's toJSONSchema WITHOUT a target, so zod 4.5+ emits 2020-12
  # constructs (raw type lists) that are invalid in an OpenAPI 3.0 document. The vendored
  # patch (rova#793's, unchanged) passes target: "openapi-3.0". Pinned exactly: the patch
  # names this version's dist files, so a floating range would silently unpatch on bump.
  # zod itself needs NO patch here: with the openapi-3.0 target zod skips compactTypeUnion's
  # type-array rewrite on its own (the function is 3.0-excluded), which is why rova#793
  # abandoned that second patch, and why this one alone keeps the spec byte-stable.
  nestjs-zod@5.5.0: patches/nestjs-zod@5.5.0.patch
