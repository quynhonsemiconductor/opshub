# Local stack for OpsHub. Project name `opshub` unless COMPOSE_PROJECT_NAME is set (in .env or the shell): that is
# what lets a second copy of this repo run beside the first. No container_name is set on purpose, for the same reason.
#
# Image majors match production: RDS Postgres 17 (tf-modules rds module default) and ElastiCache Valkey 7.2
# (tf-modules cache module default, node mode). Tags are pinned to a full version, not a moving major tag.
#
# Every host port is bound to 127.0.0.1 and read from .env (`*_HOST_PORT`, defaults below). `.env.example` lists them.
name: opshub

services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: opshub
      POSTGRES_PASSWORD: opshub
      POSTGRES_DB: opshub
    ports:
      - '127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432'
    volumes:
      - opshub_pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U opshub']
      interval: 5s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:7.2.14-alpine
    ports:
      - '127.0.0.1:${VALKEY_HOST_PORT:-6380}:6379'
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  localstack:
    image: localstack/localstack:4.14
    environment:
      AWS_DEFAULT_REGION: ap-southeast-1
      PERSISTENCE: 1
      # Standard fake credentials — the AWS SDK v3 requires credentials to sign
      # with even when the endpoint is an emulator that ignores them.
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      # The SPA origin the bucket's CORS allows (scripts/localstack/01-bootstrap.sh). Follows WEB_DEV_PORT in .env.
      WEB_ORIGIN: http://localhost:${WEB_DEV_PORT:-5173}
    ports:
      # STORAGE_ENDPOINT and AWS_ENDPOINT_URL in .env must carry the same port.
      - '127.0.0.1:${LOCALSTACK_HOST_PORT:-4567}:4566'
    volumes:
      - opshub_localstack:/var/lib/localstack
      # Init hook: runs every time LocalStack becomes ready, creating the files
      # bucket and its CORS rules. Mirrors how db/init bootstraps Postgres above.
      - ./scripts/localstack:/etc/localstack/init/ready.d:ro
    healthcheck:
      # Healthy means the init hook has RUN, not merely that LocalStack answers: the bucket
      # exists. `docker compose up --wait` therefore returns only when uploads can work, and
      # the API never races a bucket that is still being created. Keep the name in step with
      # S3_FILES_BUCKET in .env.example and BUCKET in scripts/localstack/01-bootstrap.sh
      # (test/env-example.spec.ts checks all three).
      test: ['CMD', 'awslocal', 's3api', 'head-bucket', '--bucket', 'opshub-files-dev']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  otel:
    image: otel/opentelemetry-collector-contrib:0.140.1
    command: ['--config=/etc/otel/collector.yaml']
    volumes:
      - ./scripts/otel/collector.yaml:/etc/otel/collector.yaml:ro
    ports:
      # OTEL_EXPORTER_OTLP_ENDPOINT in .env must carry the OTLP port.
      - '127.0.0.1:${OTEL_OTLP_HOST_PORT:-4319}:4318'
      # Prometheus scrape/inspect endpoint: `curl -s localhost:8890/metrics`.
      - '127.0.0.1:${OTEL_METRICS_HOST_PORT:-8890}:8889'
    healthcheck:
      # The collector image has no shell and no curl, so probe the OTLP port from the host
      # side instead — an open socket is all this needs to prove.
      test: ['CMD', '/otelcol-contrib', 'components']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  opshub_pgdata:
  opshub_localstack:
