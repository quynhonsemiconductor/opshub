services:
  postgres:
    image: postgres:18.6-alpine
    container_name: opshub-postgres
    environment:
      POSTGRES_USER: opshub
      POSTGRES_PASSWORD: opshub
      POSTGRES_DB: opshub
    ports:
      # 5433 avoids conflict with other local Postgres instances (e.g. rally on 5432).
      - '5433:5432'
    volumes:
      - opshub_pgdata:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U opshub']
      interval: 5s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:8.1.10-alpine
    container_name: opshub-valkey
    ports:
      # 6380 avoids conflict with other local Redis/Valkey instances (e.g. rally on 6379).
      - '6380:6379'
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  localstack:
    image: localstack/localstack:4
    container_name: opshub-localstack
    environment:
      AWS_DEFAULT_REGION: ap-southeast-1
      PERSISTENCE: 1
      # Standard fake credentials — the AWS SDK v3 requires credentials to sign
      # with even when the endpoint is an emulator that ignores them.
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    ports:
      # 4567 avoids conflict with other local LocalStack instances (rally on 4566),
      # matching how postgres and valkey are offset above. AWS_ENDPOINT_URL and
      # SQS_OUTBOX_URL in .env must carry this port, not 4566.
      - '4567:4566'
    volumes:
      - opshub_localstack:/var/lib/localstack
      # Init hook: runs every time LocalStack becomes ready, creating the SQS
      # queue, its DLQ and the files bucket. Mirrors how db/init bootstraps
      # Postgres above.
      - ./scripts/localstack:/etc/localstack/init/ready.d:ro
    healthcheck:
      test: ['CMD', 'awslocal', 'sqs', 'list-queues']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  otel:
    image: otel/opentelemetry-collector-contrib:0.140.1
    container_name: opshub-otel
    command: ['--config=/etc/otel/collector.yaml']
    volumes:
      - ./scripts/otel/collector.yaml:/etc/otel/collector.yaml:ro
    ports:
      # 4319 avoids conflict with other local collectors (rally would take 4318), matching
      # how postgres (5433), valkey (6380) and localstack (4567) are offset. `.env` must
      # point OTEL_EXPORTER_OTLP_ENDPOINT at this port, not 4318.
      - '4319:4318'
      # Prometheus scrape/inspect endpoint: `curl -s localhost:8890/metrics`.
      - '8890:8889'
    healthcheck:
      # The collector image has no shell and no curl, so probe the OTLP port from the host
      # side instead — an open socket is all this needs to prove.
      test: ['CMD', '/otelcol-contrib', 'components']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  opshub_pgdata:
  opshub_localstack:
